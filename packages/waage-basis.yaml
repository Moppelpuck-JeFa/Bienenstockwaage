# =====================================================================
# Basis-Package für alle Bienenstockwaagen
# =====================================================================
# Diese Datei enthält die komplette Logik, die für JEDEN Stock gleich ist:
# Globals, HX711 mit Filterkette, Kalibrier- und Tara-Buttons, das
# Wägezellen-Template, Durchsichtmodus und den Taktgeber.
#
# Sie wird NICHT direkt geflasht. Geflasht werden die Stock-Dateien im
# Repo-Root (waage-eg.yaml, waage-stock2.yaml, ...); jede davon setzt nur
# ihre substitutions und bindet diese Datei als package ein.
#
# WICHTIG - warum die Stock-Dateien im Root liegen und diese hier nicht:
# Das ESPHome Device Builder Add-on listet ausschließlich die YAML-Dateien
# direkt in /config/esphome/ als Geräte auf. Unterverzeichnisse werden nur
# über !include / packages: gelesen. Läge diese Datei im Root, tauchte sie
# als (nicht flashbares) Pseudo-Gerät im Dashboard auf.
#
# Alles Stock-spezifische steht in den substitutions unten. Die Werte hier
# sind Vorgaben; jede Stock-Datei überschreibt sie mit ihren eigenen
# (substitutions aus der Stock-Datei haben Vorrang vor denen im Package).
# =====================================================================

substitutions:
  # --- Identität ---
  # Diese beiden setzt JEDE Stock-Datei selbst. Die Vorgaben hier sind
  # bewusst leer gelassen - eine Stock-Datei ohne eigene Werte soll auffallen.
  #
  # ACHTUNG: geraete_name und anzeige_name bestimmen zusammen mit den
  # name:-Feldern der Entities die entity_id in Home Assistant
  # ("Waage eG" + "Gewicht" -> sensor.waage_eg_gewicht). Bei einem bereits
  # eingebundenen Gerät dürfen sie sich NICHT ändern, sonst legt HA neue
  # Entities an und Verlauf, Helfer, Automationen und Dashboard hängen an
  # den alten, toten IDs.
  geraete_name: "waage-unbenannt"
  anzeige_name: "Waage unbenannt"
  ap_ssid: "Waage Fallback"

  # --- Board ---
  board: d1_mini

  # --- Pins ---
  # Vorgabe ist die Verdrahtung von waage-eg; ein Stock mit abweichender
  # Verdrahtung überschreibt einzelne Werte in seiner Datei.
  # D0/GPIO16 kommt hier bewusst NIRGENDS vor: das ist der einzige Pin, über
  # den der ESP8266 aus dem Deep Sleep aufwachen kann, und er bleibt für den
  # geplanten Solar-/Batteriebetrieb frei. D4/GPIO2 ist Boot-Strapping-Pin
  # und für den MOSFET reserviert, der den HX711 stromlos schaltet.
  pin_hx711_dout: D6        # GPIO12
  pin_hx711_clk: D1         # GPIO5
  pin_temperatur: D5        # GPIO14, DS18B20 (externer Pull-up 4,7k gegen 3V3)
  pin_taster: D2            # GPIO4, Durchsicht-Taster gegen GND
  pin_led: D7               # GPIO13, Durchsicht-LED über 1k gegen GND

  # --- Startwerte der Kalibrierung ---
  # Reine PLATZHALTER für den allerersten Start eines neuen Geräts. Sobald
  # einmal kalibriert wurde, liegen die echten Werte dank restore_value im
  # Flash und diese Zahlen sind wirkungslos.
  #
  # ABER: Ein Flash, der neue globals hinzufügt, kann die gespeicherten Werte
  # verlieren - dann fällt die Waage auf genau diese Platzhalter zurück
  # (am 03.08.2026 real passiert). Deshalb nach JEDEM Flash den
  # Kalibrierfaktor prüfen. Details: docs/sessionbericht-2026-08-03.md
  start_calib_raw_zero: "0.0"
  start_calib_raw_ref: "1750.0"
  start_calib_kg_ref: "0.5"

  # --- Startwerte der Einstell-Entities ---
  # Ebenfalls nur für den ersten Start; danach gilt der in HA gesetzte Wert.
  start_referenzgewicht: "0.5"
  start_messintervall: "360"        # min (= 6 h)
  start_durchsicht_dauer: "60"      # min

esphome:
  name: ${geraete_name}
  friendly_name: "${anzeige_name}"

esp8266:
  board: ${board}
  # ZWINGEND für diese Konfiguration. Ohne diese Zeile legt ESPHome auf dem
  # ESP8266 alle "restore_value"-Werte NUR ins RTC-RAM. Das übersteht einen
  # Reboot, ist aber bei jedem Stromausfall/Steckerziehen weg - die komplette
  # Kalibrierung wäre dann auf die initial_value-Platzhalter zurückgesetzt und
  # die Waage zeigt Unsinn. Erst mit restore_from_flash landen die Werte
  # wirklich dauerhaft im Flash.
  # (Flash-Verschleiß ist hier unkritisch: Kalibrierwerte und die beiden
  # Number-Entities ändern sich nur, wenn man sie von Hand anfasst.)
  restore_from_flash: true

# WLAN-Zugangsdaten - in secrets.yaml eintragen
#
# Die !secret-Verweise hier lösen gegen die secrets.yaml im Verzeichnis der
# GEFLASHTEN Stock-Datei auf, nicht gegen dieses Unterverzeichnis. secrets.yaml
# gehört also weiterhin neben waage-eg.yaml (/config/esphome/secrets.yaml) und
# NICHT nach packages/. Nebenwirkung: "esphome config packages/waage-basis.yaml"
# direkt aufzurufen schlägt mit "packages/secrets.yaml nicht gefunden" fehl -
# das ist erwartet, geprüft werden immer die Stock-Dateien.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback-Hotspot, falls WLAN-Verbindung fehlschlägt
  ap:
    ssid: "${ap_ssid}"
    password: !secret ap_fallback_password

captive_portal:

# Home Assistant API - Passwort/Key in secrets.yaml eintragen
# Alle Stöcke teilen sich hier denselben Key. Wer pro Gerät einen eigenen
# will, legt ihn in secrets.yaml unter eigenem Namen ab und überschreibt den
# Block in der Stock-Datei (siehe Kommentar dort) - Werte aus der Stock-Datei
# haben Vorrang vor denen aus dem Package.
api:
  encryption:
    key: !secret api_encryption_key
  # Verhindert einen unnötigen Neustart, falls bei langem Messintervall
  # zwischendurch mal kurz keine Verbindung zu HA besteht
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

logger:

# Speichert den Tara-Offset, übersteht auch einen Neustart des Geräts
globals:
  - id: tare_offset
    type: float
    restore_value: yes
    initial_value: '0.0'
  # Rohwert (HX711-Zählwert), der 0 kg entspricht - per Button kalibrierbar
  - id: calib_raw_zero
    type: float
    restore_value: yes
    initial_value: '${start_calib_raw_zero}'
  # Rohwert (HX711-Zählwert), der dem Referenzgewicht entspricht
  - id: calib_raw_ref
    type: float
    restore_value: yes
    initial_value: '${start_calib_raw_ref}'
  # Das Referenzgewicht in kg, mit dem TATSÄCHLICH kalibriert wurde.
  # Bewusst getrennt von der Number-Entity "Referenzgewicht": die Number ist
  # nur die Eingabe für die NÄCHSTE Kalibrierung. Würde die Anzeige direkt
  # gegen die Number rechnen, würde ein späteres Ändern der Zahl alle
  # Messwerte still verfälschen, ohne dass neu kalibriert wurde.
  - id: calib_kg_ref
    type: float
    restore_value: yes
    initial_value: '${start_calib_kg_ref}'
  # Temperatur zum Zeitpunkt der Nullpunkt-Kalibrierung.
  # Wird aktuell NICHT verrechnet - nur festgehalten. Für eine spätere
  # Temperaturkompensation ist genau dieser Wert der Bezugspunkt
  # (kg -= (temp_jetzt - calib_temp) * koeffizient). Er lässt sich nachträglich
  # nicht rekonstruieren, deshalb wird er schon jetzt mitgespeichert - sonst
  # müsste man später nur deswegen neu kalibrieren.
  - id: calib_temp
    type: float
    restore_value: yes
    initial_value: 'NAN'
  # Zählt die Minuten seit der letzten Veröffentlichung an HA.
  # Bewusst NICHT restore_value - nach einem Neustart soll sofort
  # wieder gemessen werden, nicht erst nach dem Restintervall.
  - id: minuten_seit_messung
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Restlaufzeit des Durchsichtmodus in Minuten (0 = aus).
  # Bewusst NICHT restore_value: nach einem Neustart soll die Waage wieder
  # normal senden. Ein haengender Durchsichtmodus, den niemand bemerkt, waere
  # schlimmer als ein verlorener - im Zweifel lieber einmal zu viel druecken.
  - id: durchsicht_restminuten
    type: int
    restore_value: no
    initial_value: '0'
  # Nachlauf nach dem Ende der Durchsicht, in Minuten.
  # Die Filterkette mittelt ueber ~60 s. Direkt nach dem Zumachen steckt die
  # Manipulation noch im Fenster - dieser Wert laesst sie erst ausspuelen,
  # bevor der erste Messwert wieder nach HA geht.
  - id: nachlauf_minuten
    type: int
    restore_value: no
    initial_value: '0'

# --- 1-Wire-Bus für den Temperatursensor ---
# DS18B20 an D5 (GPIO14). D1/D2 sind vom HX711 belegt, D4 wäre GPIO2 und
# damit ein Boot-Strapping-Pin - deshalb D5.
# Externer Pull-up 4,7 kΩ zwischen D5 und 3V3 ist zwingend (nicht 5V, die
# GPIOs des ESP8266 sind nicht 5-V-tolerant).
one_wire:
  - platform: gpio
    pin: ${pin_temperatur}

# --- HX711 Wägezellen-Verstärker ---
sensor:
  - platform: hx711
    id: hx711_raw_counts
    # Dieser Sensor ist nur intern - HA bekommt den fertigen Wert weiter unten
    internal: true
    # D6 = GPIO12. Bewusst NICHT D0/GPIO16, obwohl das elektrisch ginge:
    # GPIO16 ist der einzige Pin, über den der ESP8266 aus dem Deep Sleep
    # aufwachen kann (RTC-Timer zieht GPIO16 auf Masse, deshalb muss er an RST
    # liegen). Solange DOUT dort hängt, ist Batteriebetrieb ausgeschlossen -
    # und der Zielaufbau im Garten läuft auf Solar. GPIO16 bleibt deshalb frei.
    # GPIO12 ist kein Boot-Strapping-Pin und sonst unbelegt.
    # ACHTUNG: Diese Zeile gilt nur zusammen mit der Verdrahtung. Wird sie ohne
    # das Umstecken geflasht, liest der Treiber ins Leere.
    # Hintergrund: docs/deep-sleep-vorbereitung.md
    dout_pin: ${pin_hx711_dout}
    clk_pin: ${pin_hx711_clk}
    gain: 128
    # WICHTIG: Der HX711 wird bewusst SCHNELL abgefragt (1s), auch wenn der
    # Messwert in HA nur alle paar Stunden erscheinen soll. Grund: Die
    # Filterkette unten braucht laufend frische Rohwerte, und die Kalibrier-/
    # Tara-Buttons lesen den gefilterten Zustand dieses Sensors im Moment des
    # Drückens. Bei einem langsamen Rohintervall wäre dieser Wert nie aktuell.
    # Die Taktung nach HA passiert ausschließlich über den interval:-Block
    # ganz unten, gesteuert durch die Number-Entity "Messintervall".
    update_interval: 1s
    filters:
      # 1) Ausreißer (Spikes) rausfiltern, bevor überhaupt gemittelt wird.
      #    Aus je 5 Rohwerten (= 5s) wird der Median gebildet.
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 5
      # 2) Danach noch glätten, um HX711-Rauschen zu reduzieren.
      #    12 Medianwerte a 5s = 60s Mittelungsfenster, Ausgabe alle 5s.
      - sliding_window_moving_average:
          window_size: 12
          send_every: 1
          send_first_at: 1
      # KEINE calibrate_linear hier - die Kalibrierung passiert dynamisch
      # weiter unten über die beiden Kalibrier-Buttons.

  # Das ist der Sensor, den du in Home Assistant siehst - live aus den
  # beiden Kalibrierpunkten berechnet, Tara abgezogen, auf 0,1 kg gerundet
  - platform: template
    id: waage_gewicht
    name: "Gewicht"
    unit_of_measurement: "kg"
    accuracy_decimals: 1
    # Ohne state_class legt HA keine Langzeitstatistik an - dann bleiben
    # statistics-graph-Karten und Ableitungen (kg/Tag) im Dashboard leer.
    device_class: weight
    state_class: measurement
    # "never" = kein fester Takt. Veröffentlicht wird ausschließlich, wenn
    # der interval:-Block unten oder ein Button update() aufruft.
    update_interval: never
    lambda: |-
      float raw = id(hx711_raw_counts).state;
      // Solange der HX711 noch keinen gefilterten Wert geliefert hat
      // (direkt nach dem Boot), lieber gar nichts veröffentlichen
      if (std::isnan(raw)) {
        return {};
      }
      float span = id(calib_raw_ref) - id(calib_raw_zero);
      float kg = 0.0;
      // Schutz, falls noch nicht kalibriert wurde (Division durch 0)
      if (span != 0.0) {
        kg = (raw - id(calib_raw_zero)) * id(calib_kg_ref) / span;
      }
      kg -= id(tare_offset);
      // Auf 0,1 kg genau runden. Bewusst *10 und /10 statt /0.1 und *0.1 -
      // 0.1 ist binär nicht exakt darstellbar, der Umweg über die 10 ist
      // numerisch sauberer.
      float gerundet = std::round(kg * 10.0f) / 10.0f;
      // Verhindert, dass bei minimal negativem Rohwert "-0.0" in HA landet
      if (std::fabs(gerundet) < 0.001f) {
        gerundet = 0.0f;
      }
      return gerundet;

  # DS18B20. Läuft BEWUSST auf einem eigenen 60s-Takt statt im Messintervall
  # der Waage. Zwei Gründe: der Wert ist damit für die Kalibrier-Buttons immer
  # frisch (max. 60s alt), und für die geplante Driftanalyse ist eine dichtere
  # Temperaturreihe neben einer groben Gewichtsreihe besser als umgekehrt -
  # herunterrechnen kann man später immer, nachträglich verdichten nicht.
  #
  # Der Wert wird NICHT in die Gewichtsberechnung eingerechnet. Er dient
  # ausschließlich dazu, erst einmal Daten über die reale Temperaturdrift zu
  # sammeln. Erst danach entscheiden, ob und wie kompensiert wird.
  #
  # Keine "address:" angegeben - bei genau einem Sensor am Bus sucht ESPHome
  # ihn selbst. Kommt ein zweiter dazu, braucht JEDER eine explizite Adresse
  # (die Adressen stehen beim Start im Log).
  - platform: dallas_temp
    id: temperatur
    name: "Temperatur"
    update_interval: 60s
    resolution: 12

  # --- Diagnose ---
  # Der gefilterte HX711-Rohwert, so wie ihn die Buttons und die Umrechnung
  # sehen. Der wichtigste Wert zur Fehlersuche: springt der schon ohne Last
  # um Tausende counts, liegt es an Hardware/Verkabelung/Stromversorgung -
  # nicht an der Umrechnung.
  - platform: template
    id: rohwert
    name: "Rohwert"
    icon: "mdi:counter"
    unit_of_measurement: "counts"
    accuracy_decimals: 0
    # Für die Driftanalyse: so bekommt der Rohwert eine Langzeitstatistik
    # und lässt sich über Wochen gegen die Temperatur auftragen.
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    lambda: 'return id(hx711_raw_counts).state;'

  # counts pro kg aus der aktuellen Kalibrierung. Erwartungswert bei 4x50kg
  # sind grob 18000. Steht hier etwas völlig anderes (z. B. 3500 oder ein
  # riesiger Wert), ist die Kalibrierung kaputt und muss wiederholt werden.
  - platform: template
    id: kalibrierfaktor
    name: "Kalibrierfaktor"
    icon: "mdi:function-variant"
    unit_of_measurement: "counts/kg"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      float span = id(calib_raw_ref) - id(calib_raw_zero);
      if (id(calib_kg_ref) == 0.0f) {
        return {};
      }
      return span / id(calib_kg_ref);

  # Temperatur zum Zeitpunkt der Nullpunkt-Kalibrierung. Aktuell rein
  # informativ - Bezugspunkt für eine mögliche spätere Kompensation.
  - platform: template
    id: kalibriert_bei
    name: "Kalibriert bei"
    icon: "mdi:thermometer-check"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      if (std::isnan(id(calib_temp))) {
        return {};
      }
      return id(calib_temp);

  # Zeigt, mit welchem Referenzgewicht zuletzt WIRKLICH kalibriert wurde.
  # Wichtig zur Unterscheidung von der Number-Entity "Referenzgewicht", die
  # nur die Eingabe für die nächste Kalibrierung ist.
  - platform: template
    id: kalibriert_mit
    name: "Kalibriert mit"
    icon: "mdi:weight-kilogram"
    unit_of_measurement: "kg"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
    lambda: 'return id(calib_kg_ref);'

  # Wird zusammen mit dem Gewicht aktualisiert - dadurch sieht man in HA
  # am Zeitstempel dieser Entity, wann die letzte Messung durchlief
  - platform: uptime
    id: waage_uptime
    name: "Betriebszeit"
    update_interval: never

  # WLAN-Pegel. Die Waage steht draußen am Rand der Funkabdeckung - wenn sie
  # aussetzt, sagt dieser Wert, ob es am Empfang liegt oder woanders.
  # Richtwerte: besser als -70 dBm ist gut, unter -80 dBm wird es wackelig.
  - platform: wifi_signal
    name: "WLAN-Signal"
    entity_category: diagnostic
    update_interval: 300s

# --- Verbindungsstatus ---
# WICHTIG für ein Gerät, das im Dauerbetrieb nur alle paar Stunden sendet:
# Fällt es aus, behalten alle Sensoren einfach ihren letzten Wert und in HA
# sieht nichts nach Fehler aus. Dieser Sensor macht daraus ein sauberes
# Online/Offline, auf das sich eine Benachrichtigung aufsetzen lässt.
binary_sensor:
  - platform: status
    name: "Verbindung"
    entity_category: diagnostic

  # --- Hardware-Taster fuer den Durchsichtmodus ---
  # Taster gegen GND an D2 (GPIO4), interner Pull-up, deshalb "inverted".
  # GPIO4 ist kein Boot-Strapping-Pin und sonst unbelegt.
  # Ein Druck schaltet um: aus -> an fuer die eingestellte Dauer, an -> sofort
  # aus. Das ist mit Handschuhen am Stock die einfachste Bedienung, und die LED
  # sagt sofort, was passiert ist.
  # Nur intern: der Tastenzustand selbst gehoert nicht nach HA, der Modus schon
  # (siehe switch "Durchsichtmodus").
  - platform: gpio
    id: durchsicht_taster
    internal: true
    pin:
      number: ${pin_taster}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      # Entprellen. Ohne das loest ein einziger Druck mehrfach aus und der
      # Modus schaltet sich sofort wieder ab.
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - if:
          condition:
            lambda: 'return id(durchsicht_restminuten) > 0;'
          then:
            - script.execute: durchsicht_beenden
          else:
            - script.execute: durchsicht_starten

# --- Virtueller Tara-Button + Kalibrier-Buttons ---
# Die Kalibrier- und Tara-Buttons lesen direkt den gefilterten Zustand von
# hx711_raw_counts. Der ist dank 1s-Abfrage immer aktuell (max. 5s alt),
# aber über ~60s gemittelt. Deshalb gilt fuer alle drei:
# erst auflegen/abraeumen, dann ~1 Minute warten, DANN druecken.
button:
  # Erzwingt sofort eine Veröffentlichung an HA, ohne auf das eingestellte
  # Messintervall zu warten. Gedacht fuer Einrichtung, Kalibrierung und
  # Kontrolle - im Dauerbetrieb braucht man ihn nicht.
  # Der Intervall-Zaehler startet dabei neu: nach einer manuellen Messung
  # laeuft die naechste planmaessige wieder ein volles Intervall spaeter.
  - platform: template
    name: "Jetzt messen"
    icon: "mdi:refresh"
    on_press:
      - lambda: |-
          id(minuten_seit_messung) = 0;
          id(waage_gewicht).update();
          id(waage_uptime).update();
          id(rohwert).update();
          id(kalibrierfaktor).update();
          id(kalibriert_mit).update();
          id(kalibriert_bei).update();
          // Der DS18B20 laeuft zwar ohnehin im 60s-Takt, aber "Jetzt messen"
          // soll wirklich alles frisch machen
          id(temperatur).update();
          ESP_LOGI("waage", "Manuelle Messung ausgeloest");

  # Nullt das aktuell aufliegende Gewicht (z. B. Verpackung/Behälter),
  # ändert NICHTS an der Kalibrierung selbst
  - platform: template
    name: "Tara"
    icon: "mdi:scale-balance"
    on_press:
      - lambda: |-
          float raw = id(hx711_raw_counts).state;
          if (std::isnan(raw)) {
            ESP_LOGW("waage", "Tara ignoriert: noch kein HX711-Messwert");
            return;
          }
          float span = id(calib_raw_ref) - id(calib_raw_zero);
          if (span != 0.0) {
            id(tare_offset) = (raw - id(calib_raw_zero)) * id(calib_kg_ref) / span;
            ESP_LOGI("waage", "Tara gesetzt: %.3f kg (roh %.1f)",
                     id(tare_offset), raw);
          } else {
            ESP_LOGW("waage", "Tara ignoriert: Waage noch nicht kalibriert");
          }
      - component.update: waage_gewicht
      - component.update: rohwert

  # Kalibrierung Schritt 1: Waage LEER lassen, ~1min warten, dann drücken
  - platform: template
    name: "Kalibrieren 0kg"
    icon: "mdi:target"
    on_press:
      - lambda: |-
          float raw = id(hx711_raw_counts).state;
          if (std::isnan(raw)) {
            ESP_LOGW("waage", "Kalibrierung 0kg ignoriert: kein Messwert");
            return;
          }
          id(calib_raw_zero) = raw;
          // Ein frisch gesetzter Nullpunkt macht ein altes Tara sinnlos
          id(tare_offset) = 0.0;
          // Temperatur mitschreiben - Bezugspunkt fuer eine spaetere
          // Kompensation. Wird aktuell NICHT verrechnet.
          id(calib_temp) = id(temperatur).state;
          if (std::isnan(id(calib_temp))) {
            ESP_LOGW("waage", "Nullpunkt gesetzt, aber ohne Temperatur - "
                              "DS18B20 liefert (noch) keinen Wert");
          } else {
            ESP_LOGI("waage", "Nullpunkt-Temperatur festgehalten: %.1f C",
                     id(calib_temp));
          }
          ESP_LOGI("waage", "Nullpunkt gesetzt: roh %.1f (Tara zurueckgesetzt)",
                   raw);
      - component.update: waage_gewicht
      - component.update: rohwert
      # Der Nullpunkt geht in den Span ein - der Kalibrierfaktor aendert sich
      # dadurch ebenfalls und muss neu veroeffentlicht werden
      - component.update: kalibrierfaktor
      - component.update: kalibriert_bei

  # Kalibrierung Schritt 2: Referenzgewicht auflegen, dessen Masse vorher in
  # die Number-Entity "Referenzgewicht" eintragen, ~1min warten, dann drücken
  - platform: template
    name: "Kalibrieren Referenzgewicht"
    icon: "mdi:target"
    on_press:
      - lambda: |-
          float raw = id(hx711_raw_counts).state;
          if (std::isnan(raw)) {
            ESP_LOGW("waage", "Kalibrierung ignoriert: kein Messwert");
            return;
          }
          float ref = id(referenzgewicht).state;
          if (std::isnan(ref) || ref <= 0.0f) {
            ESP_LOGW("waage", "Kalibrierung ignoriert: Referenzgewicht "
                              "ungueltig (%.3f kg)", ref);
            return;
          }
          // Der Span muss plausibel gross sein. Ein winziger Span ist der
          // klassische Fehlerfall (Gewicht vergessen, oder nach dem Auflegen
          // nicht die ~60s Filterlaufzeit abgewartet) und wuerde den
          // Umrechnungsfaktor explodieren lassen - die Waage misst dann
          // voellig konfus. Zur Groessenordnung: bei 4x50kg sind rund
          // 18000 counts/kg zu erwarten, das Minimum von 0,1 kg ergaebe
          // also ~1800 counts.
          float span = raw - id(calib_raw_zero);
          if (std::fabs(span) < 500.0f) {
            ESP_LOGW("waage", "Kalibrierung ignoriert: Span nur %.1f counts. "
                              "Liegt das Gewicht wirklich auf? Und wurden nach "
                              "dem Auflegen ~1 min gewartet?", span);
            return;
          }
          id(calib_raw_ref) = raw;
          // Das benutzte Referenzgewicht mitspeichern - ab jetzt rechnet die
          // Anzeige gegen DIESEN Wert, nicht gegen die Number-Entity
          id(calib_kg_ref) = ref;
          ESP_LOGI("waage", "Referenzpunkt gesetzt: %.3f kg = roh %.1f "
                            "(Span %.1f counts, %.1f counts/kg)",
                   ref, raw, span, span / ref);
      - component.update: waage_gewicht
      - component.update: rohwert
      - component.update: kalibriert_mit
      - component.update: kalibrierfaktor

# --- Einstellbares Referenzgewicht + Messintervall ---
# Beide erscheinen in HA als Eingabefeld (mode: box, also Zahl eintippen statt
# Schieberegler). Die Werte überleben einen Neustart (restore_value).
number:
  # Masse des Gewichts, mit dem du kalibrierst. Reine EINGABE - wirksam wird
  # sie erst beim Druck auf "Kalibrieren Referenzgewicht". Was aktuell gilt,
  # steht in der Diagnose-Entity "Kalibriert mit".
  #
  # Ein schwereres Referenzgewicht ist deutlich besser: Der Span wird auf den
  # ganzen Messbereich (bis 200 kg) hochgerechnet, bei 0,5 kg also mit Faktor
  # 400. Jeder Fehler beim Setzen des Punkts skaliert genauso mit hoch. Mit
  # 10 kg statt 0,5 kg sinkt dieser Hebel um den Faktor 20.
  - platform: template
    id: referenzgewicht
    name: "Referenzgewicht"
    icon: "mdi:weight-kilogram"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${start_referenzgewicht}      # bisheriges Verhalten als Voreinstellung
    min_value: 0.1
    max_value: 50
    step: 0.001             # erlaubt z. B. 4,987 kg fuer ein nachgewogenes Stueck
    unit_of_measurement: "kg"
    mode: box
    on_value:
      - lambda: |-
          ESP_LOGI("waage", "Referenzgewicht auf %.3f kg gesetzt - wirksam erst "
                            "beim naechsten Druck auf 'Kalibrieren "
                            "Referenzgewicht' (aktuell kalibriert mit %.3f kg)",
                   x, id(calib_kg_ref));

  - platform: template
    id: mess_intervall
    name: "Messintervall"
    icon: "mdi:timer-cog-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${start_messintervall}      # 360 min = 6 h (der bisherige feste Wert)
    min_value: 1            # 1 Minute
    max_value: 10080        # 7 Tage
    step: 1
    unit_of_measurement: "min"
    mode: box
    on_value:
      # Neue Einstellung sofort wirksam machen und einmal messen,
      # damit man in HA direkt sieht, dass die Änderung angekommen ist
      - lambda: |-
          id(minuten_seit_messung) = 0;
          id(waage_gewicht).update();
          id(waage_uptime).update();
          ESP_LOGI("waage", "Messintervall auf %.0f min gesetzt", x);

  # Wie lange der Durchsichtmodus laeuft, bis er sich selbst beendet.
  # Eine Durchsicht dauert selten laenger als eine Stunde; wer mehr braucht,
  # drueckt am Stock einfach nochmal (jeder Druck startet die Zeit neu).
  - platform: template
    id: durchsicht_dauer
    name: "Durchsichtdauer"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${start_durchsicht_dauer}
    min_value: 5
    max_value: 240
    step: 5
    unit_of_measurement: "min"
    mode: box

# --- Kontroll-LED für den Durchsichtmodus ---
# LED an D7 (GPIO13) gegen GND, in Reihe ein Vorwiderstand von 1 kΩ
# (ergibt ~1,3 mA - für eine moderne LED gut sichtbar und sparsam genug,
# dass sie im spaeteren Solarbetrieb nicht ins Gewicht faellt).
# GPIO13 ist kein Boot-Strapping-Pin. Bewusst NICHT D4/GPIO2: der bleibt als
# letzter freier Pin fuer den geplanten MOSFET reserviert, der den HX711
# stromlos schaltet (siehe docs/deep-sleep-vorbereitung.md).
output:
  - platform: gpio
    id: durchsicht_led
    pin: ${pin_led}

# --- Durchsichtmodus ---
# Waehrend einer Durchsicht misst die Waage alles Moegliche - Zargen, die
# abgestellt werden, die Hand am Rahmen, den Stockmeissel - nur nicht das
# Stockgewicht. Diese Werte duerfen nicht nach HA, sonst stehen sie fuer immer
# in der Statistik und reissen Tagesbilanz und Trend auseinander.
#
# Der HX711 laeuft dabei bewusst weiter: die Filterkette bleibt warm, und nach
# dem Ende steht sofort wieder ein eingeschwungener Wert bereit.
switch:
  - platform: template
    id: durchsichtmodus
    name: "Durchsichtmodus"
    icon: "mdi:hand-back-right-outline"
    # Nach einem Neustart immer aus - passend zum nicht gesicherten Global.
    restore_mode: ALWAYS_OFF
    # Kein optimistic: der Zustand kommt aus den Skripten, nicht aus dem
    # Schaltbefehl. Sonst wuerde HA "an" anzeigen, waehrend die Zeit laengst
    # abgelaufen ist.
    optimistic: false
    turn_on_action:
      - script.execute: durchsicht_starten
    turn_off_action:
      - script.execute: durchsicht_beenden

# Start und Ende liegen in Skripten, weil beides von zwei Seiten ausgeloest
# wird: vom Taster am Stock und vom Schalter in HA. Doppelte Logik waere hier
# die klassische Quelle fuer "am Taster geht es, in HA nicht".
script:
  - id: durchsicht_starten
    mode: restart
    then:
      - lambda: |-
          int dauer = (int) id(durchsicht_dauer).state;
          // Absicherung, falls die Number noch keinen Wert hat
          if (dauer < 1) {
            dauer = 60;
          }
          id(durchsicht_restminuten) = dauer;
          id(nachlauf_minuten) = 0;
          id(durchsichtmodus).publish_state(true);
          id(durchsicht_led).turn_on();
          ESP_LOGI("waage", "Durchsichtmodus an: %d min keine Uebertragung", dauer);

  - id: durchsicht_beenden
    mode: restart
    then:
      - lambda: |-
          id(durchsicht_restminuten) = 0;
          // Nachlauf, damit der erste Wert nach der Durchsicht sauber ist
          id(nachlauf_minuten) = 2;
          id(durchsichtmodus).publish_state(false);
          id(durchsicht_led).turn_off();
          ESP_LOGI("waage", "Durchsichtmodus aus - 2 min Nachlauf, dann Messung");

# --- Taktgeber für die Veröffentlichung an Home Assistant ---
# Läuft jede Minute und zählt hoch. Ist das eingestellte Intervall erreicht,
# werden Gewicht und Betriebszeit veröffentlicht und der Zähler beginnt neu.
interval:
  - interval: 60s
    then:
      - lambda: |-
          // --- Durchsichtmodus: nichts nach HA schicken ---
          // Laeuft die Durchsicht, wird nur heruntergezaehlt und sonst nichts.
          // Auch die Diagnose-Entities bleiben stehen: der Rohwert waehrend
          // einer Manipulation ist keine Messung, und er hat state_class
          // measurement - er landet also dauerhaft in der Langzeitstatistik.
          if (id(durchsicht_restminuten) > 0) {
            id(durchsicht_restminuten)--;
            if (id(durchsicht_restminuten) == 0) {
              // Zeit abgelaufen: dasselbe Skript wie beim Druck auf den Taster,
              // damit Schalter, LED und Nachlauf in jedem Fall gleich enden
              id(durchsicht_beenden).execute();
            }
            return;
          }

          // --- Nachlauf nach der Durchsicht ---
          // Das 60-s-Mittelungsfenster enthaelt direkt nach dem Zumachen noch
          // die Manipulation. Erst ausspuelen lassen, dann den ersten Wert
          // senden - und zwar sofort, nicht erst nach einem vollen Intervall,
          // damit man in HA sieht, dass die Waage wieder normal arbeitet.
          if (id(nachlauf_minuten) > 0) {
            id(nachlauf_minuten)--;
            if (id(nachlauf_minuten) > 0) {
              return;
            }
            ESP_LOGI("waage", "Nachlauf beendet - erster Wert nach der Durchsicht");
            id(minuten_seit_messung) = 0;
            id(waage_gewicht).update();
            id(waage_uptime).update();
            id(rohwert).update();
            id(kalibrierfaktor).update();
            id(kalibriert_mit).update();
            id(kalibriert_bei).update();
            return;
          }

          float soll_f = id(mess_intervall).state;
          // Absicherung, falls die Number noch keinen Wert hat
          if (std::isnan(soll_f) || soll_f < 1.0f) {
            soll_f = 1.0f;
          }
          uint32_t soll = (uint32_t) soll_f;

          id(minuten_seit_messung)++;

          // Solange noch nie ein Gewicht veröffentlicht wurde (frisch
          // gebootet), jede Minute erneut versuchen - dann steht der erste
          // Wert nach ~1 min in HA statt erst nach einem vollen Intervall
          bool noch_kein_wert = std::isnan(id(waage_gewicht).state);

          if (id(minuten_seit_messung) >= soll || noch_kein_wert) {
            id(minuten_seit_messung) = 0;
            id(waage_gewicht).update();
            id(waage_uptime).update();
            // Sorgt nebenbei dafür, dass die Diagnose-Entities nach einem
            // Neustart überhaupt einen Wert bekommen
            id(rohwert).update();
            id(kalibrierfaktor).update();
            id(kalibriert_mit).update();
            id(kalibriert_bei).update();
          }

  # Signalisierung des Durchsichtmodus.
  # Dauerlicht, solange reichlich Zeit ist; in den letzten 5 Minuten blinkend,
  # damit man am Stock merkt, dass es knapp wird, bevor die Waage von selbst
  # wieder sendet. Der eigene 500-ms-Takt ist noetig, weil der Minutentakt
  # oben zum Blinken zu grob ist.
  - interval: 500ms
    then:
      - lambda: |-
          static bool blinkphase = false;
          int rest = id(durchsicht_restminuten);
          if (rest <= 0) {
            id(durchsicht_led).turn_off();
            blinkphase = false;
          } else if (rest > 5) {
            id(durchsicht_led).turn_on();
            blinkphase = true;
          } else {
            blinkphase = !blinkphase;
            if (blinkphase) {
              id(durchsicht_led).turn_on();
            } else {
              id(durchsicht_led).turn_off();
            }
          }

# Optional: Web-Server für schnellen Zugriff im Browser ohne Home Assistant
web_server:
  port: 80
