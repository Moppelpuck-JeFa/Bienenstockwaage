# =====================================================================
# Basis-Package für alle Bienenstockwaagen
# =====================================================================
# Diese Datei enthält die komplette Logik, die für JEDEN Stock gleich ist:
# Globals, HX711 mit Filterkette, Kalibrier- und Tara-Buttons, das
# Wägezellen-Template, Durchsichtmodus und den Taktgeber.
#
# Sie wird NICHT direkt geflasht. Geflasht werden die Stock-Dateien im
# Repo-Root (stockwaage.yaml); die setzt nur
# ihre substitutions und bindet diese Datei als package ein.
#
# WICHTIG - warum die Stock-Dateien im Root liegen und diese hier nicht:
# Das ESPHome Device Builder Add-on listet ausschließlich die YAML-Dateien
# direkt in /config/esphome/ als Geräte auf. Unterverzeichnisse werden nur
# über !include / packages: gelesen. Läge diese Datei im Root, tauchte sie
# als (nicht flashbares) Pseudo-Gerät im Dashboard auf.
#
# Alles Stock-spezifische steht in den substitutions unten. Die Werte hier
# sind Vorgaben; jede Stock-Datei überschreibt sie mit ihren eigenen
# (substitutions aus der Stock-Datei haben Vorrang vor denen im Package).
# =====================================================================

substitutions:
  # --- Identität ---
  # Diese beiden setzt JEDE Stock-Datei selbst. Die Vorgaben hier sind
  # bewusst leer gelassen - eine Stock-Datei ohne eigene Werte soll auffallen.
  #
  # ACHTUNG: geraete_name und anzeige_name bestimmen zusammen mit den
  # name:-Feldern der Entities die entity_id in Home Assistant
  # ("Waage eG" + "Gewicht" -> sensor.waage_eg_gewicht). Bei einem bereits
  # eingebundenen Gerät dürfen sie sich NICHT ändern, sonst legt HA neue
  # Entities an und Verlauf, Helfer, Automationen und Dashboard hängen an
  # den alten, toten IDs.
  geraete_name: "waage-unbenannt"
  anzeige_name: "Waage unbenannt"
  ap_ssid: "Waage Fallback"

  # --- Board ---
  board: d1_mini

  # --- Pins ---
  # Vorgabe ist die Verdrahtung von waage-eg; ein Stock mit abweichender
  # Verdrahtung überschreibt einzelne Werte in seiner Datei.
  # D0/GPIO16 kommt hier bewusst NIRGENDS vor: das ist der einzige Pin, über
  # den der ESP8266 aus dem Deep Sleep aufwachen kann, und er bleibt für den
  # geplanten Solar-/Batteriebetrieb frei. D4/GPIO2 ist Boot-Strapping-Pin
  # und für den MOSFET reserviert, der den HX711 stromlos schaltet.
  pin_hx711_dout: D6        # GPIO12
  pin_hx711_clk: D1         # GPIO5
  pin_temperatur: D5        # GPIO14, DS18B20 (externer Pull-up 4,7k gegen 3V3)
  pin_taster: D2            # GPIO4, Durchsicht-Taster gegen GND
  pin_led: D7               # GPIO13, Durchsicht-LED über 1k gegen GND

  # --- Startwerte der Kalibrierung ---
  # Reine PLATZHALTER für den allerersten Start eines neuen Geräts. Sobald
  # einmal kalibriert wurde, liegen die echten Werte dank restore_value im
  # Flash und diese Zahlen sind wirkungslos.
  #
  # ABER: Ein Flash, der neue globals hinzufügt, kann die gespeicherten Werte
  # verlieren - dann fällt die Waage auf genau diese Platzhalter zurück
  # (am 03.08.2026 real passiert). Deshalb nach JEDEM Flash den
  # Kalibrierfaktor prüfen. Details: docs/sessionbericht-2026-08-03.md
  start_calib_raw_zero: "0.0"
  start_calib_raw_ref: "1750.0"
  start_calib_kg_ref: "0.5"

  # --- Startwerte der Einstell-Entities ---
  # Ebenfalls nur für den ersten Start; danach gilt der in HA gesetzte Wert.
  start_referenzgewicht: "0.5"
  start_messintervall: "360"        # min (= 6 h)
  start_durchsicht_dauer: "60"      # min

  # Temperaturkoeffizient der Waage in Gramm pro Kelvin.
  # Positiv heißt: die Waage zeigt bei Wärme MEHR an, gerechnet wird deshalb
  # kg -= (Temperatur - calib_temp) * koeffizient.
  #
  # 32,5 g/K ist an waage-eg über 6,8 Tage und 9,4 K gemessen
  # (docs/sessionbericht-2026-08-10.md). Der Wert gilt für DIESE vier Zellen
  # an DIESEM Aufbau und ist für einen anderen Stock nur eine Hausnummer -
  # neue Stöcke starten deshalb mit 0 (= Kompensation aus), bis ihr eigener
  # Koeffizient gemessen ist.
  start_temp_koeffizient: "32.5"    # g/K

  # --- Plausibilitaetsfenster des veroeffentlichten Gewichts ---
  # Was ausserhalb liegt, geht NICHT nach HA. Begruendung und die genaue
  # Regel stehen in packages/waage-grenzen.h; kurz: solche Werte kommen nie
  # aus dem Volk, sondern aus einer halben Kalibrierung, und sie stehen wegen
  # state_class: measurement dauerhaft in der Langzeitstatistik.
  #
  # -1 kg unten: Ein Stock kann nicht weniger als nichts wiegen, die Grenze
  # liegt aber bewusst EIN KILO darunter. Grund ist das Tara: direkt danach
  # rauscht die Anzeige um die Null, und -0,1 kg ist dort ein ECHTER Messwert.
  # Eine Grenze bei exakt 0 wuerde die untere Haelfte dieses Rauschens
  # abschneiden und den Mittelwert damit nach oben ziehen - ein Fehler, den
  # man der Statistik nicht ansieht. Das eine Kilo Luft laesst die Messung
  # heil und faengt trotzdem alles, was aus einer kaputten Kalibrierung kommt
  # (die lag real bei -3.749 kg).
  #
  # Wer noch mehr Luft braucht - etwa fuer eine Driftmessung mit leerer,
  # tarierter Waage, die ueber Tage in den negativen Bereich laufen kann -
  # setzt hier z. B. "-5".
  #
  # 150 kg oben: Beute, Volk, Honig und Futter zusammen bleiben deutlich
  # darunter (4x50 kg Zellen, mechanisches Limit 200 kg). Der Wert ist
  # absichtlich grosszuegig - er soll Rechenfehler fangen, nicht ein starkes
  # Volk in der Tracht.
  #
  # plausibel_kg_max <= plausibel_kg_min schaltet die Pruefung ganz ab.
  plausibel_kg_min: "-1"
  plausibel_kg_max: "150"

  # --- Kalibrier-Sperre ---
  # Wie viele Minuten nach einem Druck auf Tara oder einen der beiden
  # Kalibrier-Buttons NICHTS an Home Assistant geht.
  #
  # WOZU, und warum das Plausibilitaetsfenster oben dafuer nicht reicht:
  # Waehrend einer Kalibrierung liefert die Waage voellig PLAUSIBLE, aber
  # ungueltige Werte. Ein aufgelegtes Referenzgewicht von 26 kg ist von einem
  # echten Stockgewicht nicht zu unterscheiden - keine wertbasierte Regel
  # trennt das. Das Fenster faengt den kaputten Rechenweg, diese Sperre den
  # falschen Messgegenstand.
  #
  # Real nachgewiesen am 10./11.08.2026: Nach der wertbasierten Bereinigung
  # standen immer noch Einbrueche auf 0,0 kg und Spitzen auf 40,1 und 57,1 kg
  # in der Langzeitstatistik - alles aus Tara- und Kalibriervorgaengen, alles
  # innerhalb von -1..150 kg. Am Ende musste die halbe Messreihe zeitbasiert
  # weggeworfen werden. Details: docs/sessionbericht-2026-08-12.md
  #
  # 10 min sind reichlich bemessen: jeder weitere Druck startet die Zeit neu,
  # es geht also um die Zeit NACH dem letzten Handgriff - Gewicht abraeumen,
  # Deckel zu, Haende weg. Wer frueher einen Wert will, drueckt "Jetzt
  # messen"; das beendet die Sperre ausdruecklich.
  #
  # "0" schaltet die Sperre ab.
  kalibrier_sperre: "10"            # min

esphome:
  name: ${geraete_name}
  friendly_name: "${anzeige_name}"
  # Die Formel der Temperaturkompensation, damit sie nicht an drei Stellen
  # ausgeschrieben werden muss. Der Pfad löst gegen das Verzeichnis der
  # geflashten Stock-Datei auf (/config/esphome/), nicht gegen packages/ -
  # beim Kopieren ins Add-on-Verzeichnis muss packages/ also mit.
  includes:
    - packages/waage-temperatur.h
    # Mittelwert und Streuung des Messfensters, aus demselben Grund ausgelagert
    # wie die Temperaturformel: reine Zahlen, kein id(), mit g++ pruefbar.
    - packages/waage-mittelwert.h
    # Plausibilitaetsfenster des Gewichts, ebenfalls testbar gehalten
    - packages/waage-grenzen.h

esp8266:
  board: ${board}
  # ZWINGEND für diese Konfiguration. Ohne diese Zeile legt ESPHome auf dem
  # ESP8266 alle "restore_value"-Werte NUR ins RTC-RAM. Das übersteht einen
  # Reboot, ist aber bei jedem Stromausfall/Steckerziehen weg - die komplette
  # Kalibrierung wäre dann auf die initial_value-Platzhalter zurückgesetzt und
  # die Waage zeigt Unsinn. Erst mit restore_from_flash landen die Werte
  # wirklich dauerhaft im Flash.
  # (Flash-Verschleiß ist hier unkritisch: Kalibrierwerte und die beiden
  # Number-Entities ändern sich nur, wenn man sie von Hand anfasst.)
  restore_from_flash: true

# WLAN-Zugangsdaten - in secrets.yaml eintragen
#
# Die !secret-Verweise hier lösen gegen die secrets.yaml im Verzeichnis der
# GEFLASHTEN Stock-Datei auf, nicht gegen dieses Unterverzeichnis. secrets.yaml
# gehört also weiterhin neben stockwaage.yaml (/config/esphome/secrets.yaml) und
# NICHT nach packages/. Nebenwirkung: "esphome config packages/waage-basis.yaml"
# direkt aufzurufen schlägt mit "packages/secrets.yaml nicht gefunden" fehl -
# das ist erwartet, geprüft werden immer die Stock-Dateien.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback-Hotspot, falls WLAN-Verbindung fehlschlägt
  ap:
    ssid: "${ap_ssid}"
    password: !secret ap_fallback_password

captive_portal:

# Home Assistant API - Passwort/Key in secrets.yaml eintragen
# Alle Stöcke teilen sich hier denselben Key. Wer pro Gerät einen eigenen
# will, legt ihn in secrets.yaml unter eigenem Namen ab und überschreibt den
# Block in der Stock-Datei (siehe Kommentar dort) - Werte aus der Stock-Datei
# haben Vorrang vor denen aus dem Package.
api:
  encryption:
    key: !secret api_encryption_key
  # Verhindert einen unnötigen Neustart, falls bei langem Messintervall
  # zwischendurch mal kurz keine Verbindung zu HA besteht
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

logger:

# Speichert den Tara-Offset, übersteht auch einen Neustart des Geräts
globals:
  - id: tare_offset
    type: float
    restore_value: yes
    initial_value: '0.0'
  # Rohwert (HX711-Zählwert), der 0 kg entspricht - per Button kalibrierbar
  - id: calib_raw_zero
    type: float
    restore_value: yes
    initial_value: '${start_calib_raw_zero}'
  # Rohwert (HX711-Zählwert), der dem Referenzgewicht entspricht
  - id: calib_raw_ref
    type: float
    restore_value: yes
    initial_value: '${start_calib_raw_ref}'
  # Das Referenzgewicht in kg, mit dem TATSÄCHLICH kalibriert wurde.
  # Bewusst getrennt von der Number-Entity "Referenzgewicht": die Number ist
  # nur die Eingabe für die NÄCHSTE Kalibrierung. Würde die Anzeige direkt
  # gegen die Number rechnen, würde ein späteres Ändern der Zahl alle
  # Messwerte still verfälschen, ohne dass neu kalibriert wurde.
  - id: calib_kg_ref
    type: float
    restore_value: yes
    initial_value: '${start_calib_kg_ref}'
  # Temperatur zum Zeitpunkt der Nullpunkt-Kalibrierung. BEZUGSPUNKT der
  # Temperaturkompensation: gerechnet wird kg -= (temp_jetzt - calib_temp) *
  # koeffizient. Bei genau dieser Temperatur ist die Korrektur also null, und
  # die Anzeige entspricht exakt dem, was ohne Kompensation herauskäme.
  #
  # Steht hier NAN, wurde "Kalibrieren 0kg" nie gedrückt - dann gibt es keinen
  # Bezugspunkt und die Kompensation bleibt aus (siehe waage_gewicht).
  - id: calib_temp
    type: float
    restore_value: yes
    initial_value: 'NAN'
  # Letzte gültige Temperatur. Ersatzwert, falls ein einzelner 1-Wire-Lesevorgang
  # fehlschlägt (der DS18B20 veröffentlicht dann NAN).
  #
  # Warum überhaupt: Ohne Ersatzwert würde die Kompensation bei einem Aussetzer
  # stumm ausfallen und das Gewicht um bis zu 0,3 kg springen - das sähe in HA
  # aus wie ein echtes Ereignis (Schwarm, Ernte) und würde die Tagesbilanz
  # verfälschen. Ein 60 s alter Temperaturwert ist demgegenüber harmlos.
  # Bewusst NICHT restore_value: nach einem Neustart soll die Waage nicht mit
  # einer tagealten Temperatur weiterrechnen, sondern auf den ersten frischen
  # Messwert warten (das dauert höchstens 60 s).
  - id: letzte_temperatur
    type: float
    restore_value: no
    initial_value: 'NAN'
  # Zählt die Minuten seit der letzten Veröffentlichung an HA.
  # Bewusst NICHT restore_value - nach einem Neustart soll sofort
  # wieder gemessen werden, nicht erst nach dem Restintervall.
  - id: minuten_seit_messung
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Restlaufzeit des Durchsichtmodus in Minuten (0 = aus).
  # Bewusst NICHT restore_value: nach einem Neustart soll die Waage wieder
  # normal senden. Ein haengender Durchsichtmodus, den niemand bemerkt, waere
  # schlimmer als ein verlorener - im Zweifel lieber einmal zu viel druecken.
  - id: durchsicht_restminuten
    type: int
    restore_value: no
    initial_value: '0'
  # Nachlauf nach dem Ende der Durchsicht, in Minuten.
  # Die Filterkette mittelt ueber ~60 s. Direkt nach dem Zumachen steckt die
  # Manipulation noch im Fenster - dieser Wert laesst sie erst ausspuelen,
  # bevor der erste Messwert wieder nach HA geht.
  - id: nachlauf_minuten
    type: int
    restore_value: no
    initial_value: '0'

  # ---------------------------------------------------------------------
  # Messfenster: laufende Summen zwischen zwei Veroeffentlichungen
  # ---------------------------------------------------------------------
  # Bis zum 11.08.2026 ging der Momentanwert der Filterkette nach HA - ein
  # Mittel ueber 60 s, egal ob das Messintervall 1 Minute oder 6 Stunden war.
  # Die uebrigen 359 Minuten Messdaten wurden verworfen. Jetzt wird JEDER
  # Rohwert des Intervalls aufsummiert und beim Veroeffentlichen gemittelt:
  # bei 6 h sind das rund 4.300 Werte statt 12, das Rauschen sinkt um Wurzel(N).
  #
  # Alle bewusst OHNE restore_value: ein angefangenes Fenster ueber einen
  # Neustart hinweg fortzusetzen hiesse, Werte von vor und nach dem Neustart
  # zu vermengen - und genau dazwischen kann ein Flash die Kalibrierung
  # gewechselt haben. Nach einem Neustart faengt das Fenster neu an.
  #
  # Summiert wird gegen fenster_bezug (den ersten Wert des Fensters), damit die
  # Quadratsumme klein bleibt - Begruendung in packages/waage-mittelwert.h.
  - id: fenster_bezug
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: fenster_summe
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: fenster_quadratsumme
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: fenster_anzahl
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Dasselbe fuer die Temperatur. Sie MUSS ueber dasselbe Fenster gemittelt
  # werden wie der Rohwert: die Kompensation ist linear, deshalb ist
  # mittel(kg) - k*(mittel(T) - T0) exakt das Mittel der Einzelkorrekturen.
  # Wuerde der 6-h-Mittelwert dagegen mit der Temperatur des Sendezeitpunkts
  # korrigiert, zoege die Kompensation den Tagesgang wieder hinein, statt ihn
  # herauszurechnen - und zwar unbemerkt, weil das Ergebnis plausibel bleibt.
  # Ein Bezugswert ist hier unnoetig, Temperaturen werden nicht gross.
  - id: temp_fenster_summe
    type: double
    restore_value: no
    initial_value: '0.0'
  - id: temp_fenster_anzahl
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Ergebnis des zuletzt abgeschlossenen Fensters - das, was veroeffentlicht
  # wird. Alle Entities rechnen gegen DIESE drei Werte, nicht mehr direkt gegen
  # hx711_raw_counts. Dadurch zeigen Gewicht, Rohwert und Temperaturkorrektur
  # garantiert denselben Messzeitraum; frueher waren sie schon deshalb
  # konsistent, weil es nur einen Momentanwert gab.
  - id: mittel_rohwert
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: mittel_streuung
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: mittel_temperatur
    type: float
    restore_value: no
    initial_value: 'NAN'

  # ---------------------------------------------------------------------
  # Plausibilitaetspruefung des Gewichts
  # ---------------------------------------------------------------------
  # Beide bewusst OHNE restore_value - aus zwei Gruenden: ein Flash mit einem
  # neuen restore_value-Global verschiebt den Speicherplatz aller
  # nachfolgenden und kostet die Kalibrierung (03.08. und 10.08.2026 real
  # passiert, Herleitung in CLAUDE.md), und beide Werte sollen nach einem
  # Neustart ohnehin von vorn anfangen.
  #
  # Zaehlt die Messwerte, die das Plausibilitaetsfenster verworfen hat.
  # Ohne ihn waere das Verwerfen unsichtbar: die Entity "Gewicht" behaelt
  # einfach ihren letzten Stand, und das sieht in HA genau wie eine ruhige
  # Waage aus. Genau diese Verwechslung soll der Zaehler ausschliessen.
  - id: verworfene_gewichte
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # "Es gab schon einmal einen echten Messwert."
  #
  # Ersetzt die fruehere Pruefung auf isnan(waage_gewicht.state) im
  # Taktgeber. Die ging davon aus, dass ein leeres Gewicht nur "noch nicht
  # gemessen" heissen kann - seit der Plausibilitaetspruefung heisst es
  # womoeglich "dauerhaft unplausibel", und der Taktgeber wuerde dann bis in
  # alle Ewigkeit jede Minute ein Messfenster abschliessen und die
  # Diagnose-Entities veroeffentlichen. Gesetzt wird der Wert, sobald ein
  # Rohwert-Mittel vorliegt, also unabhaengig davon, ob das Gewicht selbst
  # durch die Pruefung kommt.
  - id: erste_messung_erfolgt
    type: bool
    restore_value: no
    initial_value: 'false'

  # Restlaufzeit der Kalibrier-Sperre in Minuten (0 = aus).
  #
  # Bewusst NICHT restore_value, aus demselben Grund wie bei
  # durchsicht_restminuten: eine haengende Sperre, die einen Neustart
  # ueberlebt und die niemand bemerkt, waere schlimmer als eine verlorene.
  # Nach einem Neustart misst die Waage wieder normal.
  - id: kalibrier_restminuten
    type: int
    restore_value: no
    initial_value: '0'

# --- 1-Wire-Bus für den Temperatursensor ---
# DS18B20 an D5 (GPIO14). D1/D2 sind vom HX711 belegt, D4 wäre GPIO2 und
# damit ein Boot-Strapping-Pin - deshalb D5.
# Externer Pull-up 4,7 kΩ zwischen D5 und 3V3 ist zwingend (nicht 5V, die
# GPIOs des ESP8266 sind nicht 5-V-tolerant).
one_wire:
  - platform: gpio
    pin: ${pin_temperatur}

# --- HX711 Wägezellen-Verstärker ---
sensor:
  - platform: hx711
    id: hx711_raw_counts
    # Dieser Sensor ist nur intern - HA bekommt den fertigen Wert weiter unten
    internal: true
    # D6 = GPIO12. Bewusst NICHT D0/GPIO16, obwohl das elektrisch ginge:
    # GPIO16 ist der einzige Pin, über den der ESP8266 aus dem Deep Sleep
    # aufwachen kann (RTC-Timer zieht GPIO16 auf Masse, deshalb muss er an RST
    # liegen). Solange DOUT dort hängt, ist Batteriebetrieb ausgeschlossen -
    # und der Zielaufbau im Garten läuft auf Solar. GPIO16 bleibt deshalb frei.
    # GPIO12 ist kein Boot-Strapping-Pin und sonst unbelegt.
    # ACHTUNG: Diese Zeile gilt nur zusammen mit der Verdrahtung. Wird sie ohne
    # das Umstecken geflasht, liest der Treiber ins Leere.
    # Hintergrund: docs/deep-sleep-vorbereitung.md
    dout_pin: ${pin_hx711_dout}
    clk_pin: ${pin_hx711_clk}
    gain: 128
    # WICHTIG: Der HX711 wird bewusst SCHNELL abgefragt (1s), auch wenn der
    # Messwert in HA nur alle paar Stunden erscheinen soll. Drei Gründe:
    # die Filterkette unten braucht laufend frische Rohwerte, die Kalibrier-
    # und Tara-Buttons lesen den gefilterten Zustand im Moment des Drückens,
    # und seit dem 11.08.2026 geht JEDER dieser Werte ins Messfenster ein, aus
    # dem der veröffentlichte Wert gemittelt wird. Genau daher kommt der
    # Genauigkeitsgewinn: bei 6 h Intervall mitteln rund 4.300 Werte statt 12.
    # Die Taktung nach HA passiert weiterhin ausschließlich über den
    # interval:-Block ganz unten, gesteuert durch die Number "Messintervall".
    update_interval: 1s
    filters:
      # 1) Ausreißer (Spikes) rausfiltern, bevor überhaupt gemittelt wird.
      #    Aus je 5 Rohwerten (= 5s) wird der Median gebildet.
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 5
      # 2) Danach noch glätten, um HX711-Rauschen zu reduzieren.
      #    12 Medianwerte a 5s = 60s Mittelungsfenster, Ausgabe alle 5s.
      - sliding_window_moving_average:
          window_size: 12
          send_every: 1
          send_first_at: 1
      # KEINE calibrate_linear hier - die Kalibrierung passiert dynamisch
      # weiter unten über die beiden Kalibrier-Buttons.
    on_value:
      # Jeden gefilterten Wert (alle 5 s) ins laufende Messfenster legen.
      # Aufsummiert wird der Wert NACH der Filterkette, nicht der Sekundenwert:
      # der Median hat die Spikes dann schon entfernt, und ein einzelner
      # Ausreisser soll den Intervallmittelwert nicht mitziehen.
      - lambda: |-
          // Waehrend Durchsicht und Nachlauf NICHT sammeln. Diese Werte sind
          // keine Messung des Stocks (Zarge abgestellt, Hand am Rahmen), und
          // im Mittelwert waeren sie hinterher nicht mehr herauszurechnen -
          // anders als bisher, wo sie schlicht nicht veroeffentlicht wurden.
          // Dieselbe Sperre gilt waehrend einer Kalibrierung: dann liegen
          // Pruefgewichte auf, die Waage wird tariert und der Umrechnungsweg
          // aendert sich mittendrin. Solche Rohwerte in den Mittelwert zu
          // legen hiesse, sie hinterher nicht mehr herausrechnen zu koennen.
          if (id(durchsicht_restminuten) > 0 || id(nachlauf_minuten) > 0 ||
              id(kalibrier_restminuten) > 0) {
            return;
          }
          if (std::isnan(x)) {
            return;
          }
          if (id(fenster_anzahl) == 0) {
            id(fenster_bezug) = x;
          }
          double abweichung = (double) x - id(fenster_bezug);
          id(fenster_summe) += abweichung;
          id(fenster_quadratsumme) += abweichung * abweichung;
          id(fenster_anzahl)++;

  # Das ist der Sensor, den du in Home Assistant siehst - live aus den
  # beiden Kalibrierpunkten berechnet, temperaturkompensiert, Tara abgezogen,
  # auf 0,1 kg gerundet
  - platform: template
    id: waage_gewicht
    name: "Gewicht"
    unit_of_measurement: "kg"
    accuracy_decimals: 1
    # Ohne state_class legt HA keine Langzeitstatistik an - dann bleiben
    # statistics-graph-Karten und Ableitungen (kg/Tag) im Dashboard leer.
    device_class: weight
    state_class: measurement
    # "never" = kein fester Takt. Veröffentlicht wird ausschließlich, wenn
    # der interval:-Block unten oder ein Button update() aufruft.
    update_interval: never
    lambda: |-
      // Gerechnet wird gegen den Mittelwert des abgelaufenen Messfensters,
      // nicht gegen den Momentanwert der Filterkette. Wer diesen Wert setzt,
      // steht beim Skript "messfenster_abschliessen".
      float raw = id(mittel_rohwert);
      // Solange der HX711 noch keinen gefilterten Wert geliefert hat
      // (direkt nach dem Boot), lieber gar nichts veröffentlichen
      if (std::isnan(raw)) {
        return {};
      }
      // Ab hier steht fest: es gab eine echte Messung. Der Taktgeber unten
      // haengt daran, ob er noch im Anlauf ist - bewusst hier und nicht erst
      // nach der Plausibilitaetspruefung, sonst liefe er bei dauerhaft
      // unplausiblen Werten fuer immer im Minutentakt.
      id(erste_messung_erfolgt) = true;
      float span = id(calib_raw_ref) - id(calib_raw_zero);
      float kg = 0.0;
      // Schutz, falls noch nicht kalibriert wurde (Division durch 0)
      if (span != 0.0) {
        kg = (raw - id(calib_raw_zero)) * id(calib_kg_ref) / span;
      }
      // --- Temperaturkompensation ---
      // Die Wägezellen driften mit der Temperatur; an waage-eg gemessen sind
      // das +32,5 g/K (die Waage zeigt bei Wärme zu viel). Bezugspunkt ist die
      // beim Nullpunkt festgehaltene Temperatur - dort ist die Korrektur null.
      // Die Formel steht in packages/waage-temperatur.h.
      //
      // Gerechnet wird mit der MITTLEREN Temperatur desselben Messfensters -
      // ein ueber 6 h gemitteltes Gewicht mit der Temperatur des
      // Sendezeitpunkts zu korrigieren waere schlicht falsch.
      kg -= waage_temperaturkorrektur(id(mittel_temperatur),
                                      id(calib_temp),
                                      id(temp_koeffizient).state);
      kg -= id(tare_offset);
      // Auf 0,1 kg genau runden. Bewusst *10 und /10 statt /0.1 und *0.1 -
      // 0.1 ist binär nicht exakt darstellbar, der Umweg über die 10 ist
      // numerisch sauberer.
      float gerundet = std::round(kg * 10.0f) / 10.0f;
      // Verhindert, dass bei minimal negativem Rohwert "-0.0" in HA landet.
      // Nebenwirkung und Absicht zugleich: das leichte Rauschen um die Null
      // direkt nach einem Tara faellt damit nicht unter die Untergrenze.
      if (std::fabs(gerundet) < 0.001f) {
        gerundet = 0.0f;
      }
      // --- Plausibilitaetsfenster ---
      // Letzte Station vor Home Assistant. Was hier haengenbleibt, stammt aus
      // einer kaputten oder halben Kalibrierung und nicht aus dem Stock; es
      // wuerde wegen state_class: measurement dauerhaft in der
      // Langzeitstatistik stehen. Die Regel steht in
      // packages/waage-grenzen.h, die Grenzen in den substitutions oben.
      //
      // Gar nichts veroeffentlichen, nicht kappen: die Entity behaelt ihren
      // letzten guten Wert, und der Zaehler unten macht sichtbar, dass etwas
      // verworfen wurde. Rohwert, Streuung und Temperatur gehen weiterhin
      // raus - genau die braucht man, um herauszufinden, warum.
      if (!waage_gewicht_plausibel(gerundet, ${plausibel_kg_min},
                                   ${plausibel_kg_max})) {
        id(verworfene_gewichte)++;
        ESP_LOGW("waage", "Gewicht %.1f kg verworfen - ausserhalb von "
                          "%.1f..%.1f kg (Kalibrierung pruefen! roh %.1f, "
                          "%u. Mal seit dem Neustart)",
                 gerundet, (float) ${plausibel_kg_min},
                 (float) ${plausibel_kg_max}, raw,
                 (unsigned) id(verworfene_gewichte));
        return {};
      }
      return gerundet;

  # DS18B20. Läuft BEWUSST auf einem eigenen 60s-Takt statt im Messintervall
  # der Waage. Zwei Gründe: der Wert geht in die Gewichtsberechnung ein und
  # soll dort nie älter als eine Minute sein, und für die Driftanalyse ist eine
  # dichte Temperaturreihe neben einer groben Gewichtsreihe besser als
  # umgekehrt - herunterrechnen kann man später immer, verdichten nicht.
  #
  # Seit dem 10.08.2026 wird der Wert VERRECHNET (+32,5 g/K, gemessen über
  # 6,8 Tage und 9,4 K). Die Messreihe läuft trotzdem unverändert weiter: der
  # Rohwert bleibt unkompensiert, damit sich der Koeffizient jederzeit gegen
  # neue Daten nachprüfen lässt.
  #
  # Keine "address:" angegeben - bei genau einem Sensor am Bus sucht ESPHome
  # ihn selbst. Kommt ein zweiter dazu, braucht JEDER eine explizite Adresse
  # (die Adressen stehen beim Start im Log).
  - platform: dallas_temp
    id: temperatur
    name: "Temperatur"
    update_interval: 60s
    resolution: 12
    on_value:
      # Jeden gültigen Messwert festhalten. Damit rechnet die Kompensation
      # immer mit einer höchstens 60 s alten Temperatur und überbrückt einen
      # einzelnen fehlgeschlagenen 1-Wire-Lesevorgang, statt bei einem
      # Aussetzer stumm auszufallen (das Gewicht spränge sonst um bis zu
      # 0,3 kg - in HA nicht von einem echten Ereignis zu unterscheiden).
      - lambda: |-
          if (!std::isnan(x)) {
            id(letzte_temperatur) = x;
            // Ins Messfenster, mit derselben Sperre wie der Rohwert: waehrend
            // einer Durchsicht gehoert auch die Temperatur nicht ins Mittel,
            // sonst passten Rohwert- und Temperaturfenster nicht mehr
            // zueinander und die Kompensation rechnete gegen den falschen
            // Zeitraum.
            if (id(durchsicht_restminuten) == 0 && id(nachlauf_minuten) == 0 &&
                id(kalibrier_restminuten) == 0) {
              id(temp_fenster_summe) += x;
              id(temp_fenster_anzahl)++;
            }
          } else {
            ESP_LOGW("waage", "DS18B20 lieferte keinen Wert - Kompensation "
                              "rechnet mit %.2f C weiter",
                     id(letzte_temperatur));
          }

  # --- Diagnose ---
  # Der HX711-Rohwert, gemittelt über das abgelaufene Messintervall - genau der
  # Wert, aus dem oben das Gewicht gerechnet wurde.
  #
  # Er bleibt UNKOMPENSIERT. Nur so laesst sich der Temperaturkoeffizient
  # spaeter gegen neue Daten nachpruefen; fuer diese Nachmessung ist die
  # Mittelung sogar ein Gewinn, weil Rohwert und "Temperatur Mittel" jetzt
  # denselben Zeitraum abdecken statt zweier zufaelliger Momentaufnahmen.
  - platform: template
    id: rohwert
    name: "Rohwert"
    icon: "mdi:counter"
    unit_of_measurement: "counts"
    # Eine Nachkommastelle, seit hier gemittelt wird: bei ~20.900 counts/kg
    # sind 0,1 counts rund 5 mg - die Stelle ist also weit unterhalb jeder
    # Messgenauigkeit und dient nur dazu, die Mittelung ueberhaupt sichtbar zu
    # machen. Ohne sie saehe ein ruhiges Fenster aus wie ein Momentanwert.
    accuracy_decimals: 1
    # Für die Driftanalyse: so bekommt der Rohwert eine Langzeitstatistik
    # und lässt sich über Wochen gegen die Temperatur auftragen.
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    lambda: 'return id(mittel_rohwert);'

  # Streuung der Rohwerte innerhalb des Messfensters (Standardabweichung).
  #
  # Der Preis der Mittelung: ein gemittelter Rohwert sieht auch dann ruhig aus,
  # wenn das Signal wild springt. Vorher war das die WICHTIGSTE Information zur
  # Fehlersuche - "springt der Rohwert schon ohne Last um Tausende counts, liegt
  # es an Hardware/Verkabelung/Stromversorgung". Dieser Wert ersetzt sie und
  # macht sie sogar belastbarer, weil er ueber das ganze Intervall geht statt
  # ueber den Moment, in dem man gerade hinschaut.
  #
  # ACHTUNG BEIM LESEN: Das ist die Streuung ALLER Einfluesse im Fenster, nicht
  # nur des Rauschens - bei langem Intervall steckt der Temperaturgang mit
  # drin, und zwar dominant. In der Simulation (tests/, Punkt 10) liefern
  # 300 counts Rauschen und 1 K/h Erwaermung ueber 6 h zusammen rund
  # 1.200 counts Streuung; das Rauschen allein waere ein Viertel davon.
  # Ein hoher Wert bei 6 h Intervall ist also normal. Aussagekraeftig wird die
  # Entity im Vergleich mit sich selbst: springt sie ohne Anlass (Wind,
  # Durchsicht, Wetterwechsel) auf ein Vielfaches, ist etwas an der Hardware.
  # Zur Umrechnung: bei ~20.900 counts/kg sind 200 counts rund 10 g.
  - platform: template
    id: rohwert_streuung
    name: "Rohwert Streuung"
    icon: "mdi:sine-wave"
    unit_of_measurement: "counts"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      // Bei Messungen ohne Fenster (Buttons, erster Wert nach dem Boot) gibt
      // es keine Streuung. Dann bewusst NICHTS veroeffentlichen statt einer
      // 0 - eine 0 hiesse "voellig rauschfrei" und waere eine Falschaussage.
      if (std::isnan(id(mittel_streuung))) {
        return {};
      }
      return id(mittel_streuung);

  # Mittlere Temperatur desselben Messfensters - der Partner des Rohwerts.
  #
  # BRAUCHT MAN FUER DIE NACHMESSUNG DES KOEFFIZIENTEN: Dafuer wird "Rohwert"
  # gegen "Temperatur" aufgetragen. Seit der Rohwert ein Intervallmittel ist,
  # passt der Momentanwert von "Temperatur" nicht mehr dazu - man wuerde ein
  # 6-h-Mittel gegen eine Momentaufnahme regressieren und einen zu flachen
  # Koeffizienten herausbekommen. Dieses Paar hier passt zeitlich exakt
  # zusammen.
  #
  # Die Entity "Temperatur" bleibt unveraendert im 60-s-Takt: die dichte
  # Temperaturreihe ist unabhaengig davon nuetzlich, und herunterrechnen kann
  # man sie spaeter immer, verdichten nicht.
  - platform: template
    id: temperatur_mittel
    name: "Temperatur Mittel"
    icon: "mdi:thermometer-lines"
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      if (std::isnan(id(mittel_temperatur))) {
        return {};
      }
      return id(mittel_temperatur);

  # counts pro kg aus der aktuellen Kalibrierung. Erwartungswert bei 4x50kg
  # sind grob 18000. Steht hier etwas völlig anderes (z. B. 3500 oder ein
  # riesiger Wert), ist die Kalibrierung kaputt und muss wiederholt werden.
  - platform: template
    id: kalibrierfaktor
    name: "Kalibrierfaktor"
    icon: "mdi:function-variant"
    unit_of_measurement: "counts/kg"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      float span = id(calib_raw_ref) - id(calib_raw_zero);
      if (id(calib_kg_ref) == 0.0f) {
        return {};
      }
      return span / id(calib_kg_ref);

  # Was die Temperaturkompensation gerade vom Bruttogewicht abzieht.
  #
  # Der wichtigste Wert, um die Kompensation überhaupt beurteilen zu können:
  # Ohne ihn sieht man in HA nur noch das fertige Gewicht und kann nicht mehr
  # unterscheiden, ob eine Änderung aus dem Stock kommt oder aus der Rechnung.
  # Steht hier dauerhaft 0, ist die Kompensation aus - entweder weil der
  # Koeffizient 0 ist oder weil "Kalibriert bei" leer ist (dann fehlt der
  # Bezugspunkt und es wird bewusst nicht kompensiert).
  #
  # Vorzeichen wie im Gewicht: ein POSITIVER Wert wird abgezogen, die Waage
  # zeigte also ohne Kompensation zu viel an.
  - platform: template
    id: temperaturkorrektur
    name: "Temperaturkorrektur"
    icon: "mdi:thermometer-lines"
    unit_of_measurement: "kg"
    accuracy_decimals: 3
    device_class: weight
    # Bewusst OHNE state_class: das ist kein Messwert, sondern ein
    # Rechenanteil. In der Langzeitstatistik hätte er nichts zu suchen.
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      return waage_temperaturkorrektur(id(mittel_temperatur),
                                       id(calib_temp),
                                       id(temp_koeffizient).state);

  # Temperatur zum Zeitpunkt der Nullpunkt-Kalibrierung: der Bezugspunkt der
  # Kompensation. Ist der Wert leer, wurde "Kalibrieren 0kg" nie gedrückt -
  # dann kompensiert die Waage bewusst NICHT.
  - platform: template
    id: kalibriert_bei
    name: "Kalibriert bei"
    icon: "mdi:thermometer-check"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      if (std::isnan(id(calib_temp))) {
        return {};
      }
      return id(calib_temp);

  # Zeigt, mit welchem Referenzgewicht zuletzt WIRKLICH kalibriert wurde.
  # Wichtig zur Unterscheidung von der Number-Entity "Referenzgewicht", die
  # nur die Eingabe für die nächste Kalibrierung ist.
  - platform: template
    id: kalibriert_mit
    name: "Kalibriert mit"
    icon: "mdi:weight-kilogram"
    unit_of_measurement: "kg"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
    lambda: 'return id(calib_kg_ref);'

  # Wie oft das Plausibilitaetsfenster einen Messwert verworfen hat, seit die
  # Waage zuletzt gestartet ist.
  #
  # WOZU: Ein verworfener Wert ist sonst unsichtbar - "Gewicht" behaelt
  # einfach seinen letzten Stand, und das sieht in HA aus wie eine ruhige
  # Waage. Steht hier etwas anderes als 0, ist die Anzeige aelter als der
  # Zeitstempel der Betriebszeit vermuten laesst, und die Kalibrierung ist
  # der erste Verdaechtige (Kalibrierfaktor gegen -18.000 bis -21.000
  # pruefen). Warum es passiert ist, steht im Log - dort mit Rohwert.
  #
  # Bewusst OHNE state_class: das ist kein Messwert, sondern ein Zaehler, der
  # bei jedem Neustart bei 0 anfaengt. In der Langzeitstatistik haette er
  # nichts zu suchen.
  # Restlaufzeit der Kalibrier-Sperre. Steht hier etwas anderes als 0, kommt
  # gerade absichtlich kein Messwert - die Waage wurde eben tariert oder
  # kalibriert.
  #
  # WOZU: Ohne diese Entity sieht eine gesperrte Waage in HA genauso aus wie
  # eine abgestuerzte - die Werte bleiben einfach stehen. Beim Durchsichtmodus
  # uebernimmt der Schalter diese Rolle, hier gab es nichts Vergleichbares.
  #
  # Bewusst OHNE state_class: eine Restlaufzeit ist kein Messwert.
  - platform: template
    id: kalibrier_sperre_rest
    name: "Kalibrier-Sperre"
    icon: "mdi:timer-lock-outline"
    unit_of_measurement: "min"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: 'return id(kalibrier_restminuten);'

  - platform: template
    id: gewicht_verworfen
    name: "Gewicht verworfen"
    icon: "mdi:filter-remove-outline"
    # Die Einheit ist nicht Kosmetik, sondern noetig: Home Assistant behandelt
    # eine Entity nur dann als numerisch, wenn sie eine Einheit ODER eine
    # state_class hat. Ohne beides rendert das Frontend den Rohstring - der
    # Zaehler stand als "0.0" auf dem Dashboard, und die Anzeigegenauigkeit in
    # den Entity-Einstellungen half nicht (12.08.2026 ausprobiert). Eine
    # state_class kommt nicht in Frage, die wuerde den Zaehler in die
    # Langzeitstatistik legen - also die Einheit.
    unit_of_measurement: "Werte"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    lambda: 'return id(verworfene_gewichte);'

  # Wird zusammen mit dem Gewicht aktualisiert - dadurch sieht man in HA
  # am Zeitstempel dieser Entity, wann die letzte Messung durchlief
  - platform: uptime
    id: waage_uptime
    name: "Betriebszeit"
    update_interval: never

  # WLAN-Pegel. Die Waage steht draußen am Rand der Funkabdeckung - wenn sie
  # aussetzt, sagt dieser Wert, ob es am Empfang liegt oder woanders.
  # Richtwerte: besser als -70 dBm ist gut, unter -80 dBm wird es wackelig.
  - platform: wifi_signal
    name: "WLAN-Signal"
    entity_category: diagnostic
    update_interval: 300s

# --- Verbindungsstatus ---
# WICHTIG für ein Gerät, das im Dauerbetrieb nur alle paar Stunden sendet:
# Fällt es aus, behalten alle Sensoren einfach ihren letzten Wert und in HA
# sieht nichts nach Fehler aus. Dieser Sensor macht daraus ein sauberes
# Online/Offline, auf das sich eine Benachrichtigung aufsetzen lässt.
binary_sensor:
  - platform: status
    name: "Verbindung"
    entity_category: diagnostic

  # --- Hardware-Taster fuer den Durchsichtmodus ---
  # Taster gegen GND an D2 (GPIO4), interner Pull-up, deshalb "inverted".
  # GPIO4 ist kein Boot-Strapping-Pin und sonst unbelegt.
  # Ein Druck schaltet um: aus -> an fuer die eingestellte Dauer, an -> sofort
  # aus. Das ist mit Handschuhen am Stock die einfachste Bedienung, und die LED
  # sagt sofort, was passiert ist.
  # Nur intern: der Tastenzustand selbst gehoert nicht nach HA, der Modus schon
  # (siehe switch "Durchsichtmodus").
  - platform: gpio
    id: durchsicht_taster
    internal: true
    pin:
      number: ${pin_taster}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      # Entprellen. Ohne das loest ein einziger Druck mehrfach aus und der
      # Modus schaltet sich sofort wieder ab.
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - if:
          condition:
            lambda: 'return id(durchsicht_restminuten) > 0;'
          then:
            - script.execute: durchsicht_beenden
          else:
            - script.execute: durchsicht_starten

# --- Virtueller Tara-Button + Kalibrier-Buttons ---
# Alle drei arbeiten mit dem MOMENTANWERT der Filterkette, nicht mit dem
# Messfenster-Mittel: sie beziehen sich auf das, was gerade auf der Waage
# liegt. Erzwungen wird das ueber "messfenster_frisch", das jeder von ihnen
# als erste Aktion aufruft.
#
# Der Momentanwert ist dank 1s-Abfrage immer aktuell (max. 5s alt), aber ueber
# ~60s gemittelt. Deshalb gilt fuer alle drei unveraendert:
# erst auflegen/abraeumen, dann ~1 Minute warten, DANN druecken.
button:
  # Erzwingt sofort eine Veröffentlichung an HA, ohne auf das eingestellte
  # Messintervall zu warten. Gedacht fuer Einrichtung, Kalibrierung und
  # Kontrolle - im Dauerbetrieb braucht man ihn nicht.
  # Der Intervall-Zaehler startet dabei neu: nach einer manuellen Messung
  # laeuft die naechste planmaessige wieder ein volles Intervall spaeter.
  - platform: template
    name: "Jetzt messen"
    icon: "mdi:refresh"
    on_press:
      # Bewusst der MOMENTANWERT, nicht das bisher gesammelte Fenster: Wer
      # diesen Button drueckt, will wissen, was gerade auf der Waage liegt -
      # typischerweise nach dem Auflegen eines Gewichts. Ein Mittel ueber die
      # letzten Stunden waere dafuer die falsche Antwort und saehe zudem aus
      # wie ein Fehler ("ich habe doch gerade 5 kg draufgestellt").
      # Entsprechend zeigt "Rohwert Streuung" danach keinen neuen Wert an.
      #
      # Dieser Button ist zugleich der ausdrueckliche Ausweg aus der
      # Kalibrier-Sperre: Wer ihn drueckt, WILL jetzt einen Wert in HA. Eine
      # Sperre, die sich ueber eine so eindeutige Handlung hinwegsetzt, waere
      # bevormundend - und sie saehe aus wie ein Defekt ("der Knopf tut
      # nichts"). Die Sperre schuetzt gegen Vergessen, nicht gegen Absicht.
      - lambda: |-
          if (id(kalibrier_restminuten) > 0) {
            ESP_LOGI("waage", "Kalibrier-Sperre durch \"Jetzt messen\" "
                              "beendet (%d min waeren noch offen gewesen)",
                     id(kalibrier_restminuten));
            id(kalibrier_restminuten) = 0;
          }
      - script.execute: messfenster_frisch
      - script.execute: messwerte_veroeffentlichen
      - lambda: |-
          id(minuten_seit_messung) = 0;
          // Der DS18B20 laeuft zwar ohnehin im 60s-Takt, aber "Jetzt messen"
          // soll wirklich alles frisch machen
          id(temperatur).update();
          ESP_LOGI("waage", "Manuelle Messung ausgeloest");

  # Nullt das aktuell aufliegende Gewicht (z. B. Verpackung/Behälter),
  # ändert NICHTS an der Kalibrierung selbst
  - platform: template
    name: "Tara"
    icon: "mdi:scale-balance"
    on_press:
      # Ein Tara verschiebt den Nullpunkt der Anzeige - danach ist erstmal
      # nichts mehr eine Messung des Stocks, bis die Haende weg sind.
      - script.execute: kalibrier_sperre_starten
      # Tara gilt ab JETZT. Das laufende Fenster stammt aus der Zeit davor und
      # wuerde den naechsten Mittelwert um den halben Tara-Betrag verfaelschen -
      # also verwerfen und mit dem Momentanwert weiterrechnen.
      - script.execute: messfenster_frisch
      - lambda: |-
          float raw = id(mittel_rohwert);
          if (std::isnan(raw)) {
            ESP_LOGW("waage", "Tara ignoriert: noch kein HX711-Messwert");
            return;
          }
          float span = id(calib_raw_ref) - id(calib_raw_zero);
          if (span != 0.0) {
            float brutto = (raw - id(calib_raw_zero)) * id(calib_kg_ref) / span;
            // WICHTIG: Die Temperaturkorrektur muss hier mit abgezogen werden,
            // genau wie in der Anzeige. Sonst friert das Tara die Korrektur
            // des Druckzeitpunkts ein und wandert mit jedem Grad wieder ins
            // Gewicht zurück - die Waage stünde nach dem Tarieren zwar auf
            // null, liefe über den Tag aber um den vollen Temperaturhub weg.
            float korrektur = waage_temperaturkorrektur(
                id(mittel_temperatur), id(calib_temp),
                id(temp_koeffizient).state);
            id(tare_offset) = brutto - korrektur;
            ESP_LOGI("waage", "Tara gesetzt: %.3f kg (roh %.1f, "
                              "Temperaturkorrektur %.3f kg)",
                     id(tare_offset), raw, korrektur);
          } else {
            ESP_LOGW("waage", "Tara ignoriert: Waage noch nicht kalibriert");
          }
      # Bewusst NUR die Rechenanteile ohne state_class. "Gewicht" und
      # "Rohwert" bleiben stehen, bis die Sperre ablaeuft - sonst stuende
      # genau der Wert dauerhaft in der Langzeitstatistik, den das Tara gerade
      # kuenstlich auf null gesetzt hat. Wer die 0,0 kg sofort sehen will,
      # drueckt danach "Jetzt messen".
      - component.update: temperaturkorrektur
      - component.update: kalibrier_sperre_rest

  # Kalibrierung Schritt 1: Waage LEER lassen, ~1min warten, dann drücken
  - platform: template
    name: "Kalibrieren 0kg"
    icon: "mdi:target"
    on_press:
      # Ab hier ist die Waage eine Baustelle: Nullpunkt gesetzt, aber der
      # Referenzpunkt stammt noch aus der alten Kalibrierung. Der
      # Umrechnungsfaktor ist in diesem Zustand rechnerisch halb richtig, die
      # Anzeige sieht aber weiter plausibel aus - genau das darf nicht nach HA.
      - script.execute: kalibrier_sperre_starten
      # Wie beim Tara: die im laufenden Fenster gesammelten Rohwerte sind gegen
      # die ALTE Kalibrierung entstanden und haben im naechsten Mittelwert
      # nichts zu suchen.
      - script.execute: messfenster_frisch
      - lambda: |-
          float raw = id(mittel_rohwert);
          if (std::isnan(raw)) {
            ESP_LOGW("waage", "Kalibrierung 0kg ignoriert: kein Messwert");
            return;
          }
          id(calib_raw_zero) = raw;
          // Ein frisch gesetzter Nullpunkt macht ein altes Tara sinnlos
          id(tare_offset) = 0.0;
          // Temperatur mitschreiben: ab hier ist SIE der Bezugspunkt der
          // Kompensation. Alle Korrekturen zaehlen von diesem Wert aus, die
          // Anzeige ist also genau bei dieser Temperatur unkorrigiert.
          id(calib_temp) = id(letzte_temperatur);
          if (std::isnan(id(calib_temp))) {
            ESP_LOGW("waage", "Nullpunkt gesetzt, aber ohne Temperatur - "
                              "DS18B20 liefert (noch) keinen Wert. Die "
                              "Temperaturkompensation bleibt damit AUS. "
                              "Nach dem ersten Temperaturwert (max. 60 s) "
                              "erneut 'Kalibrieren 0kg' druecken.");
          } else {
            ESP_LOGI("waage", "Nullpunkt-Temperatur festgehalten: %.1f C",
                     id(calib_temp));
          }
          ESP_LOGI("waage", "Nullpunkt gesetzt: roh %.1f (Tara zurueckgesetzt)",
                   raw);
      # Wieder nur die Diagnose ohne state_class - sie ist die Rueckmeldung,
      # auf die es beim Kalibrieren ankommt. "Gewicht" und "Rohwert" kommen
      # erst wieder, wenn die Sperre ablaeuft.
      #
      # Der Nullpunkt geht in den Span ein - der Kalibrierfaktor aendert sich
      # dadurch ebenfalls und muss neu veroeffentlicht werden
      - component.update: kalibrierfaktor
      - component.update: kalibriert_bei
      - component.update: kalibrier_sperre_rest
      # Der Bezugspunkt hat sich geaendert, damit auch die Korrektur
      # (unmittelbar nach dem Kalibrieren ist sie 0)
      - component.update: temperaturkorrektur

  # Kalibrierung Schritt 2: Referenzgewicht auflegen, dessen Masse vorher in
  # die Number-Entity "Referenzgewicht" eintragen, ~1min warten, dann drücken
  - platform: template
    name: "Kalibrieren Referenzgewicht"
    icon: "mdi:target"
    on_press:
      # Jetzt liegt ein Pruefgewicht auf. Genau das ist der Fall, den keine
      # wertbasierte Regel erkennen kann: 26 kg Referenzgewicht sehen aus wie
      # 26 kg Stock. Die Sperre laeuft ab hier neu an, deckt also das
      # Abraeumen danach mit ab.
      - script.execute: kalibrier_sperre_starten
      # Siehe "Kalibrieren 0kg": laufendes Fenster verwerfen, Momentanwert
      # nehmen. Hier zusaetzlich wichtig, weil im Fenster die Zeit VOR dem
      # Auflegen des Referenzgewichts steckt - der Span kaeme sonst zu klein
      # heraus und der Kalibrierfaktor waere still verkehrt.
      - script.execute: messfenster_frisch
      - lambda: |-
          float raw = id(mittel_rohwert);
          if (std::isnan(raw)) {
            ESP_LOGW("waage", "Kalibrierung ignoriert: kein Messwert");
            return;
          }
          float ref = id(referenzgewicht).state;
          if (std::isnan(ref) || ref <= 0.0f) {
            ESP_LOGW("waage", "Kalibrierung ignoriert: Referenzgewicht "
                              "ungueltig (%.3f kg)", ref);
            return;
          }
          // Der Span muss plausibel gross sein. Ein winziger Span ist der
          // klassische Fehlerfall (Gewicht vergessen, oder nach dem Auflegen
          // nicht die ~60s Filterlaufzeit abgewartet) und wuerde den
          // Umrechnungsfaktor explodieren lassen - die Waage misst dann
          // voellig konfus. Zur Groessenordnung: bei 4x50kg sind rund
          // 18000 counts/kg zu erwarten, das Minimum von 0,1 kg ergaebe
          // also ~1800 counts.
          float span = raw - id(calib_raw_zero);
          if (std::fabs(span) < 500.0f) {
            ESP_LOGW("waage", "Kalibrierung ignoriert: Span nur %.1f counts. "
                              "Liegt das Gewicht wirklich auf? Und wurden nach "
                              "dem Auflegen ~1 min gewartet?", span);
            return;
          }
          id(calib_raw_ref) = raw;
          // Das benutzte Referenzgewicht mitspeichern - ab jetzt rechnet die
          // Anzeige gegen DIESEN Wert, nicht gegen die Number-Entity
          id(calib_kg_ref) = ref;
          ESP_LOGI("waage", "Referenzpunkt gesetzt: %.3f kg = roh %.1f "
                            "(Span %.1f counts, %.1f counts/kg)",
                   ref, raw, span, span / ref);
      # Nur die Diagnose - "Gewicht" und "Rohwert" waeren hier das
      # aufliegende Pruefgewicht, nicht der Stock.
      - component.update: kalibriert_mit
      - component.update: kalibrierfaktor
      - component.update: kalibrier_sperre_rest

# --- Einstellbares Referenzgewicht + Messintervall ---
# Beide erscheinen in HA als Eingabefeld (mode: box, also Zahl eintippen statt
# Schieberegler). Die Werte überleben einen Neustart (restore_value).
number:
  # Masse des Gewichts, mit dem du kalibrierst. Reine EINGABE - wirksam wird
  # sie erst beim Druck auf "Kalibrieren Referenzgewicht". Was aktuell gilt,
  # steht in der Diagnose-Entity "Kalibriert mit".
  #
  # Ein schwereres Referenzgewicht ist deutlich besser: Der Span wird auf den
  # ganzen Messbereich (bis 200 kg) hochgerechnet, bei 0,5 kg also mit Faktor
  # 400. Jeder Fehler beim Setzen des Punkts skaliert genauso mit hoch. Mit
  # 10 kg statt 0,5 kg sinkt dieser Hebel um den Faktor 20.
  - platform: template
    id: referenzgewicht
    name: "Referenzgewicht"
    icon: "mdi:weight-kilogram"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${start_referenzgewicht}      # bisheriges Verhalten als Voreinstellung
    min_value: 0.1
    max_value: 50
    step: 0.001             # erlaubt z. B. 4,987 kg fuer ein nachgewogenes Stueck
    unit_of_measurement: "kg"
    mode: box
    on_value:
      - lambda: |-
          ESP_LOGI("waage", "Referenzgewicht auf %.3f kg gesetzt - wirksam erst "
                            "beim naechsten Druck auf 'Kalibrieren "
                            "Referenzgewicht' (aktuell kalibriert mit %.3f kg)",
                   x, id(calib_kg_ref));

  - platform: template
    id: mess_intervall
    name: "Messintervall"
    icon: "mdi:timer-cog-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${start_messintervall}      # 360 min = 6 h (der bisherige feste Wert)
    min_value: 1            # 1 Minute
    max_value: 10080        # 7 Tage
    step: 1
    unit_of_measurement: "min"
    mode: box
    on_value:
      # Neue Einstellung sofort wirksam machen und einmal messen,
      # damit man in HA direkt sieht, dass die Änderung angekommen ist.
      # Das laufende Fenster wird dabei verworfen: es gehörte zum alten
      # Intervall, und ein halb volles Fenster als erster Wert des neuen wäre
      # eine Mischung aus beidem.
      #
      # NUR wenn der HX711 schon misst. Dieses on_value feuert naemlich auch
      # beim Booten, wenn die Number ihren gespeicherten Wert wiederherstellt -
      # und zwar BEVOR die Kalibrier-Globals aus dem Flash geladen sind. Ohne
      # diese Sperre gingen dann einmal die Platzhalter nach HA (11.08.2026 real
      # beobachtet: "Kalibrierfaktor 3.500" und "Kalibriert mit 0,5 kg" fuer
      # 50 Sekunden). Genau diese Zahlen sind das vereinbarte Alarmzeichen fuer
      # "Kalibrierung verloren" - sie faelschlich zu senden ist schlimmer, als
      # eine Sekunde spaeter zu messen. Der HX711 liefert seinen ersten
      # gefilterten Wert nach 5 s; jede echte Bedienung liegt also lange danach.
      - if:
          condition:
            lambda: 'return !std::isnan(id(hx711_raw_counts).state);'
          then:
            - script.execute: messfenster_frisch
            - script.execute: messwerte_veroeffentlichen
      - lambda: |-
          id(minuten_seit_messung) = 0;
          ESP_LOGI("waage", "Messintervall auf %.0f min gesetzt", x);

  # Temperaturkoeffizient der Wägezellen in g/K.
  #
  # BEWUSST AUS HA EINSTELLBAR statt fest im Code: Der Koeffizient ist eine
  # Messgröße, kein Naturgesetz. Er hängt an diesen vier Zellen, an dieser
  # Verkabelung und am Aufbau; nach dem Umzug in den Garten (Sonne auf einer
  # Seite, andere thermische Ankopplung) ist er neu zu bestimmen. Als Number
  # kostet das eine Zahl in HA - fest im YAML kostete es einen Flash, und
  # jeder Flash kann die Kalibrierung mitnehmen (03.08.2026 real passiert).
  #
  # 0 schaltet die Kompensation ab. Das ist die richtige Einstellung für einen
  # Stock, dessen Koeffizient noch nicht gemessen ist: ein geratener Wert
  # macht die Messung schlechter, nicht besser - und man sieht es nicht, weil
  # das Ergebnis weiter plausibel aussieht.
  #
  # An waage-eg gemessen: +32,5 g/K (± 0,7 statistisch, real eher ± 3;
  # Teilzeiträume der Messreihe lagen zwischen 28 und 35 g/K).
  # Herleitung: docs/sessionbericht-2026-08-10.md
  - platform: template
    id: temp_koeffizient
    name: "Temperaturkoeffizient"
    icon: "mdi:thermometer-chevron-up"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${start_temp_koeffizient}
    # Der Bereich ist absichtlich weit und beidseitig: ein negatives Vorzeichen
    # ist physikalisch möglich (Waage zeigt bei Wärme WENIGER) und soll sich
    # eintragen lassen, ohne dass jemand das YAML anfassen muss.
    min_value: -200
    max_value: 200
    step: 0.1
    unit_of_measurement: "g/K"
    mode: box
    on_value:
      # Sofort sichtbar machen, was die neue Zahl bewirkt - sonst müsste man
      # bei 6 h Messintervall einen halben Tag warten, um zu sehen, ob man
      # sich vertippt hat. Der Intervallzähler läuft dabei bewusst WEITER:
      # das hier ist eine Einstellung, keine planmäßige Messung. Aus demselben
      # Grund wird das Messfenster NICHT abgeschlossen - die beiden Entities
      # unten rechnen den zuletzt veröffentlichten Messwert mit dem neuen
      # Koeffizienten nach, und genau das will man hier sehen.
      - lambda: |-
          ESP_LOGI("waage", "Temperaturkoeffizient auf %.1f g/K gesetzt "
                            "(Bezugstemperatur %.2f C)", x, id(calib_temp));
      - component.update: temperaturkorrektur
      - component.update: waage_gewicht

  # Wie lange der Durchsichtmodus laeuft, bis er sich selbst beendet.
  # Eine Durchsicht dauert selten laenger als eine Stunde; wer mehr braucht,
  # drueckt am Stock einfach nochmal (jeder Druck startet die Zeit neu).
  - platform: template
    id: durchsicht_dauer
    name: "Durchsichtdauer"
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${start_durchsicht_dauer}
    min_value: 5
    max_value: 240
    step: 5
    unit_of_measurement: "min"
    mode: box

# --- Kontroll-LED für den Durchsichtmodus ---
# LED an D7 (GPIO13) gegen GND, in Reihe ein Vorwiderstand von 1 kΩ
# (ergibt ~1,3 mA - für eine moderne LED gut sichtbar und sparsam genug,
# dass sie im spaeteren Solarbetrieb nicht ins Gewicht faellt).
# GPIO13 ist kein Boot-Strapping-Pin. Bewusst NICHT D4/GPIO2: der bleibt als
# letzter freier Pin fuer den geplanten MOSFET reserviert, der den HX711
# stromlos schaltet (siehe docs/deep-sleep-vorbereitung.md).
output:
  - platform: gpio
    id: durchsicht_led
    pin: ${pin_led}

# --- Durchsichtmodus ---
# Waehrend einer Durchsicht misst die Waage alles Moegliche - Zargen, die
# abgestellt werden, die Hand am Rahmen, den Stockmeissel - nur nicht das
# Stockgewicht. Diese Werte duerfen nicht nach HA, sonst stehen sie fuer immer
# in der Statistik und reissen Tagesbilanz und Trend auseinander.
#
# Der HX711 laeuft dabei bewusst weiter: die Filterkette bleibt warm, und nach
# dem Ende steht sofort wieder ein eingeschwungener Wert bereit.
switch:
  - platform: template
    id: durchsichtmodus
    name: "Durchsichtmodus"
    icon: "mdi:hand-back-right-outline"
    # Nach einem Neustart immer aus - passend zum nicht gesicherten Global.
    restore_mode: ALWAYS_OFF
    # Kein optimistic: der Zustand kommt aus den Skripten, nicht aus dem
    # Schaltbefehl. Sonst wuerde HA "an" anzeigen, waehrend die Zeit laengst
    # abgelaufen ist.
    optimistic: false
    turn_on_action:
      - script.execute: durchsicht_starten
    turn_off_action:
      - script.execute: durchsicht_beenden

# Start und Ende liegen in Skripten, weil beides von zwei Seiten ausgeloest
# wird: vom Taster am Stock und vom Schalter in HA. Doppelte Logik waere hier
# die klassische Quelle fuer "am Taster geht es, in HA nicht".
script:
  # --- Messfenster abschliessen ---
  # Rechnet die laufenden Summen in die drei mittel_*-Globals um und faengt ein
  # neues Fenster an. Danach - und nur danach - duerfen die Entities aktualisiert
  # werden; sie lesen ausschliesslich diese Globals.
  #
  # Ist das Fenster LEER, wird der Momentanwert der Filterkette genommen. Das
  # ist kein Notbehelf, sondern der normale Weg fuer alles, was nicht am
  # Intervall haengt: Tara, Kalibrieren, "Jetzt messen" und der erste Wert nach
  # einer Durchsicht wollen den Zustand JETZT, nicht ein Mittel ueber die
  # letzten Stunden. Die Buttons erzwingen den Fall ueber "messfenster_frisch".
  - id: messfenster_abschliessen
    mode: single
    then:
      - lambda: |-
          if (id(fenster_anzahl) > 0) {
            id(mittel_rohwert) = waage_fenster_mittelwert(
                id(fenster_bezug), id(fenster_summe), id(fenster_anzahl));
            id(mittel_streuung) = waage_fenster_streuung(
                id(fenster_summe), id(fenster_quadratsumme), id(fenster_anzahl));
          } else {
            id(mittel_rohwert) = id(hx711_raw_counts).state;
            id(mittel_streuung) = NAN;
          }
          if (id(temp_fenster_anzahl) > 0) {
            id(mittel_temperatur) = waage_fenster_mittelwert(
                0.0, id(temp_fenster_summe), id(temp_fenster_anzahl));
          } else {
            id(mittel_temperatur) = id(letzte_temperatur);
          }
          // Die Anzahl gehoert ins Log, nicht nach HA: sie beantwortet die
          // Frage "hat die Waage das Intervall wirklich durchgemessen?", und
          // genau die stellt sich nur bei der Fehlersuche. Der Cast auf
          // unsigned haelt printf und uint32_t auf allen Plattformen zusammen.
          ESP_LOGI("waage", "Messfenster: %u Rohwerte -> %.1f counts "
                            "(Streuung %.1f), %u Temperaturwerte -> %.2f C",
                   (unsigned) id(fenster_anzahl), id(mittel_rohwert),
                   id(mittel_streuung), (unsigned) id(temp_fenster_anzahl),
                   id(mittel_temperatur));
          // Neues Fenster. Bezug und Summen werden beim ersten Wert ohnehin
          // neu gesetzt, entscheidend sind die beiden Zaehler.
          id(fenster_bezug) = 0.0;
          id(fenster_summe) = 0.0;
          id(fenster_quadratsumme) = 0.0;
          id(fenster_anzahl) = 0;
          id(temp_fenster_summe) = 0.0;
          id(temp_fenster_anzahl) = 0;

  # --- Laufendes Fenster verwerfen und den Momentanwert nehmen ---
  # Fuer alles, was die Grundlage der Messung veraendert: nach dem Tarieren
  # oder Kalibrieren sind die gesammelten Rohwerte gegen eine andere Rechnung
  # entstanden und duerfen nicht in den naechsten Mittelwert einfliessen.
  - id: messfenster_frisch
    mode: single
    then:
      - lambda: |-
          id(fenster_anzahl) = 0;
          id(temp_fenster_anzahl) = 0;
          id(messfenster_abschliessen).execute();

  # --- Alles nach HA schicken ---
  # Bewusst an EINER Stelle: die Liste wird vom Taktgeber, vom Nachlauf nach der
  # Durchsicht und vom Button "Jetzt messen" gebraucht. Stand sie dreimal da,
  # blieb beim Ergaenzen eines Sensors regelmaessig eine Stelle zurueck - der
  # Sensor war dann nach einem Neustart dauerhaft leer, ohne dass etwas
  # fehlerhaft aussah. Wer einen Sensor ergaenzt, traegt ihn nur noch hier ein.
  #
  # Vorher muss immer ein Messfenster abgeschlossen worden sein, sonst
  # veroeffentlicht das hier den vorigen Wert noch einmal.
  - id: messwerte_veroeffentlichen
    mode: single
    then:
      - lambda: |-
          id(waage_gewicht).update();
          id(waage_uptime).update();
          id(rohwert).update();
          id(rohwert_streuung).update();
          id(temperatur_mittel).update();
          id(kalibrierfaktor).update();
          id(kalibriert_mit).update();
          id(kalibriert_bei).update();
          id(temperaturkorrektur).update();
          id(gewicht_verworfen).update();
          id(kalibrier_sperre_rest).update();

  # --- Kalibrier-Sperre starten ---
  # Wird von allen drei Buttons aufgerufen, die die Grundlage der Messung
  # anfassen: Tara, "Kalibrieren 0kg", "Kalibrieren Referenzgewicht".
  #
  # Jeder Druck startet die Zeit NEU (wie beim Durchsicht-Taster). Bei einer
  # Zwei-Punkt-Kalibrierung liegen zwischen den beiden Druecken ein paar
  # Minuten - gezaehlt wird deshalb ab dem letzten Handgriff, nicht ab dem
  # ersten.
  - id: kalibrier_sperre_starten
    mode: single
    then:
      - lambda: |-
          int dauer = ${kalibrier_sperre};
          if (dauer <= 0) {
            return;   // Sperre per substitution abgeschaltet
          }
          id(kalibrier_restminuten) = dauer;
          id(kalibrier_sperre_rest).update();
          ESP_LOGI("waage", "Kalibrier-Sperre: %d min keine Uebertragung "
                            "(\"Jetzt messen\" beendet sie vorzeitig)", dauer);

  - id: durchsicht_starten
    mode: restart
    then:
      - lambda: |-
          int dauer = (int) id(durchsicht_dauer).state;
          // Absicherung, falls die Number noch keinen Wert hat
          if (dauer < 1) {
            dauer = 60;
          }
          id(durchsicht_restminuten) = dauer;
          id(nachlauf_minuten) = 0;
          id(durchsichtmodus).publish_state(true);
          id(durchsicht_led).turn_on();
          ESP_LOGI("waage", "Durchsichtmodus an: %d min keine Uebertragung", dauer);

  - id: durchsicht_beenden
    mode: restart
    then:
      - lambda: |-
          // NUR AUFRAEUMEN, WENN WIRKLICH EINE DURCHSICHT LIEF.
          //
          // Der Schalter oben hat restore_mode: ALWAYS_OFF. ESPHome ruft
          // dafuer beim Booten turn_off() auf, und das fuehrt das
          // turn_off_action aus - also dieses Skript. Ohne die Abfrage
          // startete damit JEDER Neustart einen 2-Minuten-Nachlauf, obwohl
          // nie jemand den Taster gedrueckt hat.
          //
          // Am 19.08.2026 am Geraet nachgewiesen. Folgen im Deep-Sleep-
          // Betrieb, wo jedes Aufwachen ein Neustart ist:
          //   - ein zusaetzlicher Sendevorgang bei rund 60 s Betriebszeit,
          //     und zwar ein MOMENTANWERT (der Nachlauf schickt bewusst
          //     keinen Fenstermittelwert) - vor dem Ende der gemessenen
          //     90 s Einschwingzeit
          //   - waehrend des Nachlaufs sammelt das Messfenster nicht. Der
          //     eigentliche Messwert bei 90 s stand deshalb auf 39 statt
          //     rund 120 Rohwerten.
          //
          // Gefragt wird der Schalterzustand, nicht durchsicht_restminuten:
          // beim Ablauf der Zeit hat der Taktgeber den Zaehler bereits auf
          // 0 gesetzt, bevor er hierher kommt.
          if (!id(durchsichtmodus).state) {
            id(durchsicht_restminuten) = 0;
            id(durchsicht_led).turn_off();
            return;
          }
          id(durchsicht_restminuten) = 0;
          // Nachlauf, damit der erste Wert nach der Durchsicht sauber ist
          id(nachlauf_minuten) = 2;
          id(durchsichtmodus).publish_state(false);
          id(durchsicht_led).turn_off();
          ESP_LOGI("waage", "Durchsichtmodus aus - 2 min Nachlauf, dann Messung");

# --- Taktgeber für die Veröffentlichung an Home Assistant ---
# Läuft jede Minute und zählt hoch. Ist das eingestellte Intervall erreicht,
# wird das Messfenster abgeschlossen (= alle seither gesammelten Rohwerte
# gemittelt), das Ergebnis veröffentlicht und der Zähler beginnt neu.
#
# Das Intervall bestimmt damit nicht mehr nur, wie OFT gesendet wird, sondern
# auch, ueber wie lange gemittelt wird - ein langes Intervall ist seit dem
# 11.08.2026 also genauer, nicht nur sparsamer.
interval:
  - interval: 60s
    then:
      - lambda: |-
          // --- Durchsichtmodus: nichts nach HA schicken ---
          // Laeuft die Durchsicht, wird nur heruntergezaehlt und sonst nichts.
          // Auch die Diagnose-Entities bleiben stehen: der Rohwert waehrend
          // einer Manipulation ist keine Messung, und er hat state_class
          // measurement - er landet also dauerhaft in der Langzeitstatistik.
          //
          // Dass waehrenddessen auch nichts ins Messfenster gesammelt wird,
          // steht am on_value des HX711 und des DS18B20 - hier zu sperren
          // reichte nicht, die Werte laufen im 5-s-Takt auf.
          if (id(durchsicht_restminuten) > 0) {
            id(durchsicht_restminuten)--;
            if (id(durchsicht_restminuten) == 0) {
              // Zeit abgelaufen: dasselbe Skript wie beim Druck auf den Taster,
              // damit Schalter, LED und Nachlauf in jedem Fall gleich enden
              id(durchsicht_beenden).execute();
            }
            return;
          }

          // --- Nachlauf nach der Durchsicht ---
          // Das 60-s-Mittelungsfenster enthaelt direkt nach dem Zumachen noch
          // die Manipulation. Erst ausspuelen lassen, dann den ersten Wert
          // senden - und zwar sofort, nicht erst nach einem vollen Intervall,
          // damit man in HA sieht, dass die Waage wieder normal arbeitet.
          if (id(nachlauf_minuten) > 0) {
            id(nachlauf_minuten)--;
            if (id(nachlauf_minuten) > 0) {
              return;
            }
            // Wurde waehrend der Durchsicht auch noch tariert oder
            // kalibriert, hat die Kalibrier-Sperre Vorrang: sie
            // veroeffentlicht selbst, wenn sie ablaeuft.
            if (id(kalibrier_restminuten) > 0) {
              return;
            }
            ESP_LOGI("waage", "Nachlauf beendet - erster Wert nach der Durchsicht");
            id(minuten_seit_messung) = 0;
            // Momentanwert statt Fenster: waehrend Durchsicht und Nachlauf
            // wurde nichts gesammelt, und was noch vom Fenster VOR der
            // Durchsicht uebrig ist, gehoert zu einem anderen Stockzustand -
            // eine abgenommene Honigzarge steckte sonst zur Haelfte im ersten
            // Wert danach.
            id(messfenster_frisch).execute();
            id(messwerte_veroeffentlichen).execute();
            return;
          }

          // --- Kalibrier-Sperre ---
          // Nach Tara oder Kalibrieren gehoert das, was die Waage anzeigt,
          // nicht dem Stock: da liegt ein Pruefgewicht auf, oder der
          // Nullpunkt ist gerade verschoben worden. Solche Werte sind
          // PLAUSIBEL und deshalb hinterher nicht mehr von echten zu
          // trennen - anders als bei den Ausreissern, die das
          // Plausibilitaetsfenster faengt.
          //
          // Aufgebaut wie der Durchsicht-Nachlauf: herunterzaehlen, und beim
          // Ablauf sofort einen frischen Wert schicken, damit man in HA
          // sieht, dass die Waage wieder arbeitet. Der Intervall-Zaehler
          // ruht solange - die Sperre verschiebt die naechste planmaessige
          // Messung, sie verschluckt sie nicht.
          if (id(kalibrier_restminuten) > 0) {
            id(kalibrier_restminuten)--;
            id(kalibrier_sperre_rest).update();
            if (id(kalibrier_restminuten) > 0) {
              return;
            }
            ESP_LOGI("waage", "Kalibrier-Sperre abgelaufen - erster Wert "
                              "danach");
            id(minuten_seit_messung) = 0;
            // Momentanwert statt Fenster: waehrend der Sperre wurde nichts
            // gesammelt, und was davor uebrig war, gehoert zur alten
            // Kalibrierung.
            id(messfenster_frisch).execute();
            id(messwerte_veroeffentlichen).execute();
            return;
          }

          // --- Nach dem Booten auf die erste Temperatur warten ---
          // HX711 und DS18B20 laufen beide im 60-s-Takt und melden sich nach
          // einem Neustart in unbestimmter Reihenfolge. Ohne diese Sperre
          // koennte der allererste Wert nach jedem Neustart unkompensiert
          // nach HA gehen und stuende dort dauerhaft als Stufe von bis zu
          // 0,3 kg in der Statistik - genau die Sorte Artefakt, gegen die es
          // schon den Durchsichtmodus gibt.
          //
          // Gewartet wird hoechstens 3 Minuten und nur dann, wenn die
          // Kompensation ueberhaupt aktiv waere. Ein defekter DS18B20 legt
          // die Waage damit nicht still, er kostet nur diese drei Minuten.
          static uint8_t warte_auf_temperatur = 0;
          if (std::isnan(id(letzte_temperatur)) && warte_auf_temperatur < 3 &&
              !std::isnan(id(calib_temp)) &&
              id(temp_koeffizient).state != 0.0f) {
            warte_auf_temperatur++;
            ESP_LOGI("waage", "Warte auf den ersten Temperaturwert, bevor der "
                              "erste Messwert nach HA geht (%d/3)",
                     warte_auf_temperatur);
            return;
          }

          float soll_f = id(mess_intervall).state;
          // Absicherung, falls die Number noch keinen Wert hat
          if (std::isnan(soll_f) || soll_f < 1.0f) {
            soll_f = 1.0f;
          }
          uint32_t soll = (uint32_t) soll_f;

          id(minuten_seit_messung)++;

          // Solange noch nie ein Gewicht veröffentlicht wurde (frisch
          // gebootet), jede Minute erneut versuchen - dann steht der erste
          // Wert nach ~1 min in HA statt erst nach einem vollen Intervall.
          //
          // Gefragt wird das Global, NICHT mehr isnan(waage_gewicht.state):
          // seit der Plausibilitaetspruefung kann die Entity auch dauerhaft
          // leer bleiben (kaputte Kalibrierung), und dann haette diese
          // Bedingung den Anlauf nie verlassen - das Messfenster wuerde jede
          // Minute abgeschlossen und die Diagnose-Entities im Minutentakt
          // veroeffentlicht, also genau in dem Moment am meisten Funk und
          // Rechnung, in dem die Waage ohnehin schon nicht misst.
          bool noch_kein_wert = !id(erste_messung_erfolgt);

          if (id(minuten_seit_messung) >= soll || noch_kein_wert) {
            id(minuten_seit_messung) = 0;
            // Der planmäßige Fall - und der einzige, in dem ein volles
            // Messfenster zusammenkommt. Erst abschließen (das setzt die
            // mittel_*-Globals und startet das nächste Fenster), dann
            // veröffentlichen; die Reihenfolge ist zwingend, sonst ginge der
            // vorige Messwert ein zweites Mal nach HA.
            //
            // Sorgt nebenbei dafür, dass die Diagnose-Entities nach einem
            // Neustart überhaupt einen Wert bekommen.
            id(messfenster_abschliessen).execute();
            id(messwerte_veroeffentlichen).execute();
          }

  # Signalisierung des Durchsichtmodus.
  # Dauerlicht, solange reichlich Zeit ist; in den letzten 5 Minuten blinkend,
  # damit man am Stock merkt, dass es knapp wird, bevor die Waage von selbst
  # wieder sendet. Der eigene 500-ms-Takt ist noetig, weil der Minutentakt
  # oben zum Blinken zu grob ist.
  - interval: 500ms
    then:
      - lambda: |-
          static bool blinkphase = false;
          int rest = id(durchsicht_restminuten);
          if (rest <= 0) {
            id(durchsicht_led).turn_off();
            blinkphase = false;
          } else if (rest > 5) {
            id(durchsicht_led).turn_on();
            blinkphase = true;
          } else {
            blinkphase = !blinkphase;
            if (blinkphase) {
              id(durchsicht_led).turn_on();
            } else {
              id(durchsicht_led).turn_off();
            }
          }

