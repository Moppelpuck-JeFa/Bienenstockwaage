# =====================================================================
# Stock 2
# =====================================================================
# Die gesamte Logik steht in packages/waage-basis.yaml. Hier stehen nur
# die Werte, die diesen Stock von den anderen unterscheiden.
#
# VOR dem ersten Flashen entscheiden, wie dieser Stock heissen soll -
# danach ist ein Umbenennen teuer: geraete_name und anzeige_name bilden
# die entity_id in HA ("Waage Stock 2" + "Gewicht" ->
# sensor.waage_stock_2_gewicht). Wird spaeter umbenannt, legt HA neue
# Entities an und der bisherige Verlauf haengt an den alten IDs.
# Vorschlag siehe README, Abschnitt "Mehrere Stoecke".
#
# Vor der Inbetriebnahme:
#   1. Namen festlegen (siehe oben)
#   2. Verdrahtung pruefen - die Pins unten sind die Vorgabe von waage-eg
#   3. Flashen, dann BEIDE Kalibrierschritte fahren (leer + Referenzgewicht)
# =====================================================================

substitutions:
  # --- Identität ---
  geraete_name: "waage-stock2"
  anzeige_name: "Waage Stock 2"
  ap_ssid: "Waage-Stock2 Fallback"

  # --- Pins (identische Verdrahtung wie waage-eg) ---
  pin_hx711_dout: D6        # GPIO12
  pin_hx711_clk: D1         # GPIO5
  pin_temperatur: D5        # GPIO14
  pin_taster: D2            # GPIO4
  pin_led: D7               # GPIO13

  # --- Startwerte der Kalibrierung ---
  # Reine Platzhalter bis zur ersten Kalibrierung. Der daraus rechnerische
  # Faktor (3.500 counts/kg) ist bewusst weit vom Erwartungswert (~18.000
  # bis 21.000 counts/kg bei 4x50 kg) entfernt - so faellt sofort auf, wenn
  # noch nicht oder nicht vollstaendig kalibriert wurde.
  start_calib_raw_zero: "0.0"
  start_calib_raw_ref: "1750.0"
  start_calib_kg_ref: "0.5"

  # --- Startwerte der Einstell-Entities ---
  start_referenzgewicht: "0.5"
  start_messintervall: "360"        # min (= 6 h)
  start_durchsicht_dauer: "60"      # min

packages:
  basis: !include packages/waage-basis.yaml

# Alle Stoecke teilen sich standardmaessig den API-Key und das OTA-Passwort
# aus secrets.yaml. Fuer einen eigenen Key pro Geraet den Block hier
# einkommentieren und den Key in secrets.yaml anlegen - Werte aus dieser
# Datei haben Vorrang vor denen aus dem Package:
#
#   api:
#     encryption:
#       key: !secret api_key_stock2
#
#   ota:
#     - platform: esphome
#       password: !secret ota_password_stock2
