# =====================================================================
# Stock 1 - "Waage eG"  (das bestehende, produktive Geraet)
# =====================================================================
# Die gesamte Logik steht in packages/waage-basis.yaml. Hier stehen nur
# die Werte, die diesen einen Stock von den anderen unterscheiden.
#
# ACHTUNG - diese Datei ist die einzige Verbindung zu den bestehenden
# Home-Assistant-Entities. geraete_name und anzeige_name bilden zusammen
# mit den name:-Feldern im Package die entity_id
# ("Waage eG" + "Gewicht" -> sensor.waage_eg_gewicht). Werden sie
# geaendert, legt HA neue Entities an; Verlauf, Helfer, Automationen und
# Dashboard haengen danach an den alten, toten IDs.
#
# Beim Flashen nach der Package-Umstellung: Der Kalibrierfaktor kann durch
# den Flash verloren gehen (am 03.08.2026 real passiert). Also nach dem
# Flash "Waage eG Kalibrierfaktor" pruefen - erwartet werden rund
# -20.840 counts/kg. Steht dort der Platzhalter, BEIDE Kalibrierschritte
# neu fahren, nicht nur den Referenzpunkt.
# =====================================================================

substitutions:
  # --- Identität (nicht aendern, siehe oben) ---
  geraete_name: "waage-eg"
  anzeige_name: "Waage eG"
  ap_ssid: "Waage-Eg Fallback"

  # --- Pins (wie verbaut, siehe README "Anschluesse") ---
  pin_hx711_dout: D6        # GPIO12
  pin_hx711_clk: D1         # GPIO5
  pin_temperatur: D5        # GPIO14
  pin_taster: D2            # GPIO4
  pin_led: D7               # GPIO13

  # --- Startwerte der Kalibrierung ---
  # Nur Platzhalter fuer den allerersten Start. Die echten Werte liegen
  # dank restore_value im Flash. Bewusst unveraendert uebernommen, damit
  # die Package-Umstellung am Verhalten dieses Geraets nichts aendert.
  start_calib_raw_zero: "0.0"
  start_calib_raw_ref: "1750.0"
  start_calib_kg_ref: "0.5"

  # --- Startwerte der Einstell-Entities ---
  start_referenzgewicht: "0.5"
  start_messintervall: "360"        # min (= 6 h)
  start_durchsicht_dauer: "60"      # min

packages:
  basis: !include packages/waage-basis.yaml

# Eigener API-Key / OTA-Passwort nur fuer diesen Stock waere hier moeglich
# (Werte aus dieser Datei haben Vorrang vor denen aus dem Package):
#
#   api:
#     encryption:
#       key: !secret api_key_waage_eg
#
# Fuer waage-eg BEWUSST NICHT gemacht: ein neuer Key erzwingt ein erneutes
# Hinzufuegen des Geraets in HA und riskiert genau die Entity-IDs, die
# hier erhalten bleiben sollen.
